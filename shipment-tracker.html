  card.querySelector('#addRowBtn').addEventListener('click', addRow);
  card.querySelector('#exportOneBtn').addEventListener('click', () => exportExcel(false));
  card.querySelector('#archiveShippedBtn').addEventListener('click', () => archiveShippedRows(state.active));

  renderTableBody();
}

/* ---- Excel-style column dropdown ---- */
let activeDropdown = null;

function openColDropdown(field, triggerBtn){
  closeColDropdown();

  const col = COLUMNS.find(c => c.field === field);
  const isDateCol = col && col.type === 'date';
  const allRows = state.data[state.active] || [];

  // Thai month names
  const THAI_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

  // For date columns: group by "เดือน YYYY" month buckets
  // For others: unique display values
  const valueCounts = {};
  allRows.forEach(r => {
    let v = (r[field] || '').toString().trim();
    if(isDateCol && v){
      const d = parseDate(v);
      v = d ? `${THAI_MONTHS[d.getMonth()]} ${d.getFullYear() + 543}` : v;
    } else if(col && col.type === 'select' && col.options){
      const opt = col.options.find(o => o.value === v);
      v = opt ? opt.label : v;
    }
    if(!v) v = '(ว่าง)';
    valueCounts[v] = (valueCounts[v] || 0) + 1;
  });

  const allValues = Object.keys(valueCounts).sort((a,b) => {
    if(a === '(ว่าง)') return 1;
    if(b === '(ว่าง)') return -1;
    if(isDateCol){
      // Sort by real date: parse "ม.ค. 2568" back
      const toSort = s => {
        const m = THAI_MONTHS.indexOf(s.split(' ')[0]);
        const y = parseInt(s.split(' ')[1] || '0', 10) - 543;
        return y * 100 + m;
      };
      return toSort(a) - toSort(b);
    }
    return a.localeCompare(b, 'th');
  });

  // Map display → raw values for date columns (for hidden filter matching)
  // hidden filter stores display "month bucket" strings
  const currentFilter = filterState[field] || '';
  let hiddenValues = colHiddenValues[field] ? new Set(colHiddenValues[field]) : new Set();

  const rect = triggerBtn.getBoundingClientRect();
  const panel = document.createElement('div');
  panel.className = 'col-dropdown';
  panel.style.top  = (rect.bottom + 4) + 'px';
  panel.style.left = Math.min(rect.left, window.innerWidth - 220) + 'px';

  const searchPlaceholder = isDateCol ? 'ค้นหาเดือน...' : 'ค้นหา...';

  panel.innerHTML = `
    <div class="col-dropdown-head">
      ${isDateCol ? '' : `<input type="text" class="col-dropdown-search" placeholder="${searchPlaceholder}" id="colSearch" value="${escapeAttr(currentFilter)}">`}
      ${isDateCol ? `<div style="font-size:11.5px;font-weight:600;color:var(--navy);padding:4px 0 6px;font-family:var(--display);">เลือกเดือน</div>` : ''}
      <div class="col-dropdown-actions">
        <button class="col-dropdown-action" id="colSelAll">เลือกทั้งหมด</button>
        <button class="col-dropdown-action" id="colClearAll" style="color:var(--muted);">ล้าง</button>
      </div>
    </div>
    <div class="col-dropdown-list" id="colList"></div>
    <div class="col-dropdown-foot">
      <button class="btn btn-ghost btn-sm" id="colCancel" style="font-size:12px;">ยกเลิก</button>
      <button class="btn btn-accent btn-sm" id="colApply" style="font-size:12px;">✓ Apply</button>
    </div>`;

  document.body.appendChild(panel);
  activeDropdown = { panel, field };

  function renderItems(search){
    const list = panel.querySelector('#colList');
    const filtered = allValues.filter(v => v.toLowerCase().includes(search.toLowerCase()));
    list.innerHTML = filtered.map(v => {
      const checked = !hiddenValues.has(v);
      const icon = isDateCol ? '📅 ' : '';
      return `<div class="col-dropdown-item">
        <input type="checkbox" ${checked ? 'checked' : ''} value="${escapeAttr(v)}">
        <span class="item-label">${icon}${escapeHtml(v)}</span>
        <span class="item-count">${valueCounts[v]}</span>
      </div>`;
    }).join('');
    list.querySelectorAll('input[type=checkbox]').forEach(chk => {
      chk.addEventListener('change', () => {
        if(chk.checked) hiddenValues.delete(chk.value);
        else hiddenValues.add(chk.value);
      });
    });
  }

  renderItems('');
  if(!isDateCol){
    panel.querySelector('#colSearch').focus();
    panel.querySelector('#colSearch').addEventListener('input', e => renderItems(e.target.value));
  }
  panel.querySelector('#colSelAll').addEventListener('click', () => { hiddenValues.clear(); renderItems(isDateCol ? '' : (panel.querySelector('#colSearch')?.value || '')); });
  panel.querySelector('#colClearAll').addEventListener('click', () => { allValues.forEach(v => hiddenValues.add(v)); renderItems(isDateCol ? '' : (panel.querySelector('#colSearch')?.value || '')); });
  panel.querySelector('#colCancel').addEventListener('click', closeColDropdown);
  panel.querySelector('#colApply').addEventListener('click', () => {
    const searchVal = isDateCol ? '' : (panel.querySelector('#colSearch')?.value.trim() || '');
    if(searchVal) filterState[field] = searchVal;
    else delete filterState[field];
    if(hiddenValues.size > 0) colHiddenValues[field] = [...hiddenValues];
    else delete colHiddenValues[field];
    closeColDropdown();
    renderCard();
  });

  setTimeout(() => document.addEventListener('click', outsideClick), 0);
  function outsideClick(e){ if(!panel.contains(e.target)){ closeColDropdown(); } }
  activeDropdown.outsideClick = outsideClick;
}

function closeColDropdown(){
  if(!activeDropdown) return;
  if(activeDropdown.panel && activeDropdown.panel.parentNode)
    activeDropdown.panel.parentNode.removeChild(activeDropdown.panel);
  if(activeDropdown.outsideClick)
    document.removeEventListener('click', activeDropdown.outsideClick);
  activeDropdown = null;
}

function rowMatchesFilters(r){
  // Text search filter
  const textOk = Object.entries(filterState).every(([field, val]) => {
    if(!val) return true;
    const cellVal = (r[field] || '');
    const col = COLUMNS.find(c => c.field === field);
    if(col && col.type === 'select') return cellVal === val;
    return cellVal.toLowerCase().includes(val.toLowerCase());
  });
  if(!textOk) return false;
  // Hidden value filter (checkbox uncheck)
  return Object.entries(colHiddenValues).every(([field, hiddenArr]) => {
    if(!hiddenArr || hiddenArr.length === 0) return true;
    const col = COLUMNS.find(c => c.field === field);
    let displayVal = (r[field] || '').toString().trim();
    if(col && col.type === 'date' && displayVal){
      const d = parseDate(displayVal);
      displayVal = d ? `${THAI_MONTHS_SHORT[d.getMonth()]} ${d.getFullYear() + 543}` : displayVal;
    } else if(col && col.type === 'select' && col.options){
      const opt = col.options.find(o => o.value === displayVal);
      displayVal = opt ? opt.label : displayVal;
    }
    if(!displayVal) displayVal = '(ว่าง)';
    return !hiddenArr.includes(displayVal);
  });
}

const PART_COLOR_COUNT = 8;

function buildPartColorMap(rows){
  const map = {};
  let idx = 0;
  rows.forEach(r => {
    const key = (r.part || '').trim();
    if(key && !(key in map)){
      map[key] = idx % PART_COLOR_COUNT;
      idx++;
    }
  });
  return map;
}

function inputWidth(val, col){
  const minCh = col.field === 'qty' ? 7 : 22;
  const ch = Math.max((val || '').trim().length, minCh);
  return ch + 'ch';
}

function buildRowElement(r, rowIdx, partColorMap){
  const tr = document.createElement('tr');
  const partKey = (r.part || '').trim();
  const colorIdx = partKey && partColorMap ? partColorMap[partKey] : null;
  if(colorIdx !== null && colorIdx !== undefined){
    tr.classList.add(`part-color-${colorIdx}`);
  }

  const cellsHtml = COLUMNS.map(col => {
    if(col.type === 'select'){
      const meta = col.field === 'status' ? statusMeta(r.status) : null;
      const cls = meta ? `status-select ${meta.cls}` : 'status-select';
      const optionsHtml = col.options.map(o =>
        `<option value="${escapeAttr(o.value)}" ${o.value === (r[col.field] || '') ? 'selected' : ''}>${escapeHtml(o.label)}</option>`
      ).join('');
      return `<td data-col="${col.field}"><select class="${cls}" data-field="${col.field}">${optionsHtml}</select></td>`;
    }
    const type = (col.type === 'date') ? 'date' : 'text';
    const inputMode = (col.type === 'number') ? ' inputmode="numeric"' : '';
    const placeholder = col.placeholder ? ` placeholder="${escapeAttr(col.placeholder)}"` : '';
    const widthStyle = (type !== 'date') ? ` style="width:${inputWidth(r[col.field], col)}"` : '';
    if(col.field === 'part' && colorIdx !== null && colorIdx !== undefined){
      return `<td data-col="${col.field}"><div class="part-chip part-color-dot-${colorIdx}"><input type="${type}"${inputMode}${placeholder}${widthStyle} data-field="${col.field}" value="${escapeAttr(r[col.field])}"></div></td>`;
    }
    return `<td data-col="${col.field}"><input type="${type}"${inputMode}${placeholder}${widthStyle} data-field="${col.field}" value="${escapeAttr(r[col.field])}"></td>`;
  }).join('');

  tr.setAttribute('draggable', 'true');
  tr.dataset.rowIdx = rowIdx;

  tr.innerHTML = `
    <td class="idx">
      <div class="idx-inner">
        <span class="drag-handle" title="ลากเพื่อจัดเรียง">⠿</span>
        <button class="row-duplicate" title="Duplicate แถวนี้">⧉</button>
        <span class="idx-num">${rowIdx + 1}</span>
      </div>
    </td>
    ${cellsHtml}
    <td class="action-cell"><button class="row-delete" title="ลบแถวนี้">🗑</button></td>
  `;

  tr.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', () => {
      updateCell(rowIdx, inp.dataset.field, inp.value);
      if(inp.type !== 'date'){
        const col = COLUMNS.find(c => c.field === inp.dataset.field);
        if(col) inp.style.width = inputWidth(inp.value, col);
      }
      // Refresh day summary if planDate changed and popup is currently open
      if(inp.dataset.field === 'planDate'){
        const popup = document.getElementById('daySummaryPopup');
        if(popup.style.display !== 'none') openDaySummary(inp.value, inp);
      }
    });
  });

  // Day-summary trigger: separate icon button next to the planDate input,
  // so clicking the date field itself always opens the native calendar normally.
  const planDateCell = tr.querySelector('td[data-col="planDate"]');
  if(planDateCell){
    const planDateInput = planDateCell.querySelector('input[type="date"]');
    const summaryBtn = document.createElement('button');
    summaryBtn.type = 'button';
    summaryBtn.className = 'plan-date-summary-btn';
    summaryBtn.title = 'View all items shipping this day';
    summaryBtn.textContent = '📋';
    summaryBtn.addEventListener('click', e => {
      e.stopPropagation();
      const val = planDateInput.value;
      if(val) openDaySummary(val, summaryBtn);
    });
    planDateCell.appendChild(summaryBtn);
  }

  const statusSelect = tr.querySelector('select[data-field="status"]');
  if(statusSelect){
    statusSelect.addEventListener('change', () => {
      updateCell(rowIdx, 'status', statusSelect.value);
      const m = statusMeta(statusSelect.value);
      STATUS_OPTIONS.forEach(o => statusSelect.classList.remove(o.cls));
      statusSelect.classList.add(m.cls);
    });
  }

  const shipModeSelect = tr.querySelector('select[data-field="shipMode"]');
  if(shipModeSelect){
    shipModeSelect.addEventListener('change', () => {
      updateCell(rowIdx, 'shipMode', shipModeSelect.value);
    });
  }

  tr.querySelector('.row-delete').addEventListener('click', () => deleteRow(rowIdx));
  tr.querySelector('.row-duplicate').addEventListener('click', () => duplicateRow(rowIdx));

  // Drag-to-reorder
  tr.addEventListener('dragstart', e => {
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', String(rowIdx));
    setTimeout(() => tr.classList.add('drag-dragging'), 0);
  });
  tr.addEventListener('dragend', () => tr.classList.remove('drag-dragging'));
  tr.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('#tbody tr').forEach(r => r.classList.remove('drag-over'));
    tr.classList.add('drag-over');
  });
  tr.addEventListener('dragleave', () => tr.classList.remove('drag-over'));
  tr.addEventListener('drop', e => {
    e.preventDefault();
    tr.classList.remove('drag-over');
    const fromIdx = parseInt(e.dataTransfer.getData('text/plain'), 10);
    const toIdx = rowIdx;
    if(fromIdx === toIdx) return;
    const rows = state.data[state.active];
    const [moved] = rows.splice(fromIdx, 1);
    rows.splice(toIdx, 0, moved);
    saveState();
    renderTableBody();
  });

  return tr;
}

function renderTableBody(){
  const tbody = document.getElementById('tbody');
  if(!tbody) return;
  tbody.innerHTML = '';
  const rows = state.data[state.active] || [];
  const hasFilters = Object.values(filterState).some(v => v) || Object.keys(colHiddenValues).length > 0;
  const partColorMap = buildPartColorMap(rows);

  let shown = 0;
  rows.forEach((r, idx) => {
    if(hasFilters && !rowMatchesFilters(r)) return;
    tbody.appendChild(buildRowElement(r, idx, partColorMap));
    shown++;
  });

  if(shown === 0){
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = COLUMNS.length + 2;
    td.style.textAlign = 'center';
    td.style.color = 'var(--muted)';
    td.style.padding = '24px';
    td.textContent = hasFilters ? 'ไม่พบรายการที่ตรงกับตัวกรอง' : 'ยังไม่มีข้อมูล';
    tr.appendChild(td);
    tbody.appendChild(tr);
  }
}

/* ============================================================
   📊 PART CATALOGUE — summary across all customers / sheets
   ============================================================ */

const STRIP_COLORS = ['#F5A623','#3A8FE0','#7B5CF0','#2DBF6A','#E0437A','#20B2C4','#E07A20','#9B4CF0'];

/* ---------- Catalogue date chip popup ---------- */
let catDatePopupOutside = null;

function closeCatDatePopup(){
  document.getElementById('catDatePopup').style.display = 'none';
  if(catDatePopupOutside){ document.removeEventListener('click', catDatePopupOutside); catDatePopupOutside = null; }
}

function openCatDatePopup(dateStr, customer, anchorEl){
  closeCatDatePopup();
  // Find all rows across all customers matching this planDate
  const rows = [];
  state.customers.forEach(cust => {
    (state.data[cust] || []).forEach((r, idx) => {
      if((r.planDate || '') === dateStr){
        rows.push({ cust, idx, r });
      }
    });
  });
  if(rows.length === 0) return;

  const totalQty = rows.reduce((s, {r}) => s + (parseQty(r.qty)), 0);
  const popup = document.getElementById('catDatePopup');

  const rowsHtml = rows.map(({cust, idx, r}) => {
    const qty = parseQty(r.qty);
    return `
      <div class="cat-date-popup-row">
        <div class="cat-date-popup-info">
          <div class="cat-date-popup-pn">${escapeHtml(r.part || r.mpn || '—')}${r.mpn ? ` <span style="font-weight:400;color:var(--muted);font-size:10.5px;">(${escapeHtml(r.mpn)})</span>` : ''}</div>
          <div class="cat-date-popup-meta">${escapeHtml(cust)}${r.po ? ' · PO '+escapeHtml(r.po) : ''}</div>
        </div>
        <span class="cat-date-popup-qty">${qty > 0 ? qty.toLocaleString() : '—'}</span>
        <button class="cat-date-popup-link" data-cust="${escapeAttr(cust)}" data-idx="${idx}">→ View Record</button>
      </div>`;
  }).join('');

  popup.innerHTML = `
    <div class="cat-date-popup-head">
      <div>
        <h5>📅 ${formatThaiDate(dateStr)}</h5>
        <p>${rows.length} item${rows.length !== 1 ? 's' : ''} · Total Qty ${totalQty > 0 ? totalQty.toLocaleString() : '—'}</p>
      </div>
      <button class="cat-date-popup-close" id="catDatePopupClose">✕</button>
    </div>
    <div class="cat-date-popup-body">${rowsHtml}</div>`;

  // Position near anchor
  const rect = anchorEl.getBoundingClientRect();
  const pw = 300, ph = 360;
  let top  = rect.bottom + 6;
  let left = rect.left;
  if(left + pw > window.innerWidth - 12) left = window.innerWidth - pw - 12;
  if(top  + ph > window.innerHeight - 12) top = rect.top - ph - 6;
  popup.style.top  = top  + 'px';
  popup.style.left = left + 'px';
  popup.style.display = 'flex';

  document.getElementById('catDatePopupClose').addEventListener('click', closeCatDatePopup);

  // Link buttons → close catalogue, go to customer + highlight row
  popup.querySelectorAll('.cat-date-popup-link').forEach(btn => {
    btn.addEventListener('click', () => {
      const cust = btn.dataset.cust;
      const rowIdx = parseInt(btn.dataset.idx, 10);
      // Close catalogue overlay and popup
      document.getElementById('catalogueOverlay').style.display = 'none';
      closeCatDatePopup();
      // Navigate to customer
      state.active = cust;
      filterState = {};
      colHiddenValues = {};
      saveState();
      renderAll();
      // Scroll + highlight row
      setTimeout(() => {
        const tbody = document.getElementById('tbody');
        if(!tbody) return;
        const tr = tbody.querySelector(`tr[data-row-idx="${rowIdx}"]`);
        if(tr){
          tr.scrollIntoView({ behavior:'smooth', block:'center' });
          tr.classList.remove('alert-highlight');
          void tr.offsetWidth;
          tr.classList.add('alert-highlight');
          setTimeout(() => tr.classList.remove('alert-highlight'), 2200);
        }
      }, 80);
    });
  });

  setTimeout(() => {
    catDatePopupOutside = e => {
      if(!popup.contains(e.target) && !anchorEl.contains(e.target)) closeCatDatePopup();
    };
    document.addEventListener('click', catDatePopupOutside);
  }, 0);
}


function parseQty(v){
  // Strip commas (thousands separator) before parsing, e.g. "2,200" → 2200
  if(v === null || v === undefined || v === '') return 0;
  return parseFloat(String(v).replace(/,/g, '')) || 0;
}

function monthKey(dateStr){
  const d = parseDate(dateStr);
  if(!d) return null;
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function monthLabel(key){
  if(!key) return '';
  const [y, m] = key.split('-');
  return `${THAI_MONTHS_SHORT[parseInt(m,10)-1]} ${parseInt(y,10)+543}`;
}

function buildCatalogueData(filterMonth){
  const partMap = {};

  state.customers.forEach(customer => {
    (state.data[customer] || []).forEach(r => {
      const part = (r.part || '').trim();
      const mpn  = (r.mpn  || '').trim();
      if(!part && !mpn) return;

      // Month filter — use planDate, fallback to date
      if(filterMonth){
        const mk = monthKey(r.planDate || r.date || '');
        if(mk !== filterMonth) return;
      }

      // Group key: MPN takes priority so same MPN merges across customers
      const key = mpn || part;

      if(!partMap[key]){
        partMap[key] = {
          key, mpn,
          parts: new Set(part ? [part] : []),
          customers: {},
          colorIdx: Object.keys(partMap).length % STRIP_COLORS.length
        };
      } else {
        if(part) partMap[key].parts.add(part);
        if(mpn && !partMap[key].mpn) partMap[key].mpn = mpn;
      }

      const qty    = parseQty(r.qty);
      const status = r.status || '';

      if(!partMap[key].customers[customer])
        partMap[key].customers[customer] = { qty: 0, qtyShipped: 0, qtyPending: 0, statuses: [], planDates: [], pos: [] };

      const c = partMap[key].customers[customer];
      c.qty += qty;
      if(status === 'shipped') c.qtyShipped += qty;
      if(status === 'pending') c.qtyPending += qty;
      if(status && !c.statuses.includes(status)) c.statuses.push(status);
      if(r.planDate && !c.planDates.includes(r.planDate)) c.planDates.push(r.planDate);
      if(r.po && !c.pos.includes(r.po)) c.pos.push(r.po);
    });
  });

  return Object.values(partMap).map(p => {
    const totalQty     = Object.values(p.customers).reduce((s, c) => s + c.qty, 0);
    const totalShipped = Object.values(p.customers).reduce((s, c) => s + c.qtyShipped, 0);
    const totalPending = Object.values(p.customers).reduce((s, c) => s + c.qtyPending, 0);
    const custCount    = Object.keys(p.customers).length;
    const partList     = [...p.parts].join(', ');
    const part = p.mpn || partList || p.key || '';
    // Keep parts as array (Set doesn't survive spread into plain object)
    return { ...p, parts: p.parts, part, partList, mpn: p.mpn || '', totalQty, totalShipped, totalPending, custCount };
  });
}

function getAllMonths(){
  // Collect all month keys from planDate/date across all customers
  const months = new Set();
  state.customers.forEach(customer => {
    (state.data[customer] || []).forEach(r => {
      const mk = monthKey(r.planDate || r.date || '');
      if(mk) months.add(mk);
    });
  });
  return [...months].sort();
}

function exportCatalogueByCustomer(parts, filterMonth, filterCustomer){
  const wb = XLSX.utils.book_new();
  const today = new Date();
  const stamp = today.getFullYear() + '-' + pad2(today.getMonth()+1) + '-' + pad2(today.getDate());

  const custList = filterCustomer
    ? [filterCustomer]
    : [...new Set(parts.flatMap(p => Object.keys(p.customers)))].sort();

  // Helper: does row belong to one of the visible parts?
  const rowMatchesPart = (r, p) => {
    const rMpn  = (r.mpn  || '').trim();
    const rPart = (r.part || '').trim();
    return (rMpn && p.mpn && rMpn === p.mpn) ||
           (p.parts && rPart && p.parts.has(rPart)) ||
           (!p.mpn && rPart === p.partList);
  };

  // Collect all dates and months visible in selected data
  const dateSet  = new Set();
  const monthSet = new Set();
  custList.forEach(cust => {
    (state.data[cust] || []).forEach(r => {
      if(!parts.some(p => rowMatchesPart(r, p))) return;
      if(filterMonth && monthKey(r.planDate || r.date || '') !== filterMonth) return;
      const dk = r.planDate || r.date || '';
      if(dk){ dateSet.add(dk); const mk = monthKey(dk); if(mk) monthSet.add(mk); }
    });
  });
  const allDates  = [...dateSet].sort();
  const allMonths = [...monthSet].sort();

  if(allDates.length === 0 && allMonths.length === 0){ showToast('No data to export'); return; }

  const MONTH_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const fmtM = mk => { const [y,m] = mk.split('-').map(Number); return `${MONTH_EN[(m||1)-1]} ${y}`; };

  // ── Sheet 1: Summary (total per MPN per customer) ──
  const sumHeader = ['MPN', 'Part No.', ...custList, 'Grand Total'];
  const sumRows   = [];
  parts.forEach(p => {
    const custQtys = custList.map(cust => {
      if(!p.customers[cust]) return '';
      let sum = 0;
      (state.data[cust] || []).forEach(r => {
        if(!rowMatchesPart(r, p)) return;
        if(filterMonth && monthKey(r.planDate || r.date || '') !== filterMonth) return;
        sum += parseQty(r.qty);
      });
      return sum || '';
    });
    const total = custQtys.reduce((s,v) => s + (Number(v)||0), 0);
    if(total > 0) sumRows.push([p.mpn||'', p.partList||'', ...custQtys, total]);
  });
  const grandSum = custList.map((_,i) => sumRows.reduce((s,r) => s+(Number(r[2+i])||0),0));
  sumRows.push(['', 'GRAND TOTAL', ...grandSum, grandSum.reduce((s,v)=>s+v,0)]);
  const wsSum = XLSX.utils.aoa_to_sheet([sumHeader, ...sumRows]);
  wsSum['!cols'] = sumHeader.map((_,i) => ({wch: i<2?18:14}));
  XLSX.utils.book_append_sheet(wb, wsSum, 'Summary');

  // ── Sheet 2: Summary by Month (pivot MPN × Customer × Month) ──
  if(!filterMonth && allMonths.length > 0){
    const mHeader = ['MPN', 'Part No.', 'Customer', ...allMonths.map(fmtM), 'Total'];
    const mRows   = [];
    parts.forEach(p => {
      const partTotals = {};
      custList.forEach(cust => {
        if(!p.customers[cust]) return;
        const mqtys = allMonths.map(mk => {
          let sum = 0;
          (state.data[cust] || []).forEach(r => {
            if(!rowMatchesPart(r, p)) return;
            if(monthKey(r.planDate || r.date || '') === mk) sum += parseQty(r.qty);
          });
          return sum || '';
        });
        const total = mqtys.reduce((s,v) => s+(Number(v)||0), 0);
        if(total > 0){
          mRows.push([p.mpn||'', p.partList||'', cust, ...mqtys, total]);
          allMonths.forEach((mk,i) => { partTotals[mk] = (partTotals[mk]||0)+(Number(mqtys[i])||0); });
        }
      });
      if(custList.filter(c => p.customers[c]).length > 1){
        const sub = allMonths.map(mk => partTotals[mk]||'');
        const subTotal = sub.reduce((s,v)=>s+(Number(v)||0),0);
        if(subTotal > 0) mRows.push([p.mpn||'', p.partList||'', '── Subtotal ──', ...sub, subTotal]);
      }
    });
    const grandM = allMonths.map((_,i) =>
      mRows.filter(r=>r[2]!=='── Subtotal ──').reduce((s,r)=>s+(Number(r[3+i])||0),0));
    mRows.push(['','','GRAND TOTAL', ...grandM, grandM.reduce((s,v)=>s+v,0)]);
    const wsM = XLSX.utils.aoa_to_sheet([mHeader, ...mRows]);
    wsM['!cols'] = mHeader.map((_,i) => ({wch: i<3?18:14}));
    XLSX.utils.book_append_sheet(wb, wsM, 'Summary by Month');
  }

  // ── Sheet 3: By Date (pivot MPN × Customer × Plan Date) ──
  if(allDates.length > 0){
    const dHeader = ['MPN', 'Part No.', 'Customer', ...allDates, 'Total'];
    const dRows   = [];
    parts.forEach(p => {
      const partDateTotals = {};
      custList.forEach(cust => {
        if(!p.customers[cust]) return;
        const dqtys = allDates.map(dk => {
          let sum = 0;
          (state.data[cust] || []).forEach(r => {
            if(!rowMatchesPart(r, p)) return;
            if(filterMonth && monthKey(r.planDate || r.date || '') !== filterMonth) return;
            if((r.planDate || r.date || '') === dk) sum += parseQty(r.qty);
          });
          return sum || '';
        });
        const total = dqtys.reduce((s,v) => s+(Number(v)||0), 0);
        if(total > 0){
          dRows.push([p.mpn||'', p.partList||'', cust, ...dqtys, total]);
          allDates.forEach((dk,i) => { partDateTotals[dk] = (partDateTotals[dk]||0)+(Number(dqtys[i])||0); });
        }
      });
      if(custList.filter(c => p.customers[c]).length > 1){
        const sub = allDates.map(dk => partDateTotals[dk]||'');
        const subTotal = sub.reduce((s,v)=>s+(Number(v)||0),0);
        if(subTotal > 0) dRows.push([p.mpn||'', p.partList||'', '── Subtotal ──', ...sub, subTotal]);
      }
    });
    const grandD = allDates.map((_,i) =>
      dRows.filter(r=>r[2]!=='── Subtotal ──').reduce((s,r)=>s+(Number(r[3+i])||0),0));
    dRows.push(['','','GRAND TOTAL', ...grandD, grandD.reduce((s,v)=>s+v,0)]);
    const wsD = XLSX.utils.aoa_to_sheet([dHeader, ...dRows]);
    wsD['!cols'] = dHeader.map((_,i) => ({wch: i<3?18:12}));
    XLSX.utils.book_append_sheet(wb, wsD, 'By Date');
  }

  const custSuffix  = filterCustomer ? `-${sanitizeSheetName(filterCustomer)}` : '-all-customers';
  const monthSuffix = filterMonth ? `-${filterMonth}` : '';
  XLSX.writeFile(wb, `catalogue-by-customer${custSuffix}${monthSuffix}-${stamp}.xlsx`);
  showToast(`Exported ${wb.SheetNames.length} sheets`);
}

function exportCatalogue(parts, filterMonth){
  const wb = XLSX.utils.book_new();
  const today = new Date();
  const stamp = today.getFullYear() + '-' + pad2(today.getMonth()+1) + '-' + pad2(today.getDate());
  const allCustomers = [...new Set(parts.flatMap(p => Object.keys(p.customers)))].sort();

  /* ── Sheet 1: Summary ── */
  const summaryHeader = filterMonth
    ? ['MPN', 'Part No.', 'Total Qty', 'Shipped', 'Pending', ...allCustomers]
    : ['MPN', 'Part No.', 'Total Qty', 'Shipped', 'Pending', ...allCustomers];

  const summaryRows = parts.map(p => {
    const custQtys = allCustomers.map(c => p.customers[c] ? p.customers[c].qty : 0);
    return [p.mpn||'', p.partList||'', p.totalQty, p.totalShipped, p.totalPending, ...custQtys];
  });
  const wsSummary = XLSX.utils.aoa_to_sheet([summaryHeader, ...summaryRows]);
  wsSummary['!cols'] = summaryHeader.map((_, i) => ({ wch: i < 5 ? 18 : 14 }));
  XLSX.utils.book_append_sheet(wb, wsSummary, 'Summary');

  /* ── Sheet 2: Detail ── */
  // Collect all unique plan dates across filtered parts
  const allDates = filterMonth
    ? [...new Set(
        parts.flatMap(p =>
          Object.values(p.customers).flatMap(c => c.planDates || [])
        )
      )].sort()
    : [];

  /* ── Sheet 2: Detail ── */
  if(filterMonth){
    // Month selected → raw rows per shipment
    const detailHeader = ['MPN', 'Part No.', 'Customer', 'PO', 'SO', 'DO',
      'Plan Date', 'Ship Date', 'Ship Mode', 'Forwarder', 'Tracking', 'INV',
      'Qty', 'Status', 'Noted'];
    const detailRows = [];
    state.customers.forEach(cust => {
      (state.data[cust] || []).forEach(r => {
        const rMpn  = (r.mpn  || '').trim();
        const rPart = (r.part || '').trim();
        const matchedPart = parts.find(p =>
          (rMpn && p.mpn && rMpn === p.mpn) ||
          (p.parts && rPart && p.parts.has(rPart)) ||
          (!p.mpn && rPart === p.partList)
        );
        if(!matchedPart) return;
        const mk = monthKey(r.planDate || r.date || '');
        if(mk !== filterMonth) return;
        detailRows.push([rMpn, rPart, cust,
          r.po||'', r.so||'', r.do||'',
          r.planDate||'', r.date||'', r.shipMode||'',
          r.forwarder||'', r.tracking||'', r.inv||'',
          r.qty||'', statusMeta(r.status).label.replace('— เลือกสถานะ —',''), r.note||'']);
      });
    });
    const wsDetail = XLSX.utils.aoa_to_sheet([detailHeader, ...detailRows]);
    wsDetail['!cols'] = detailHeader.map(() => ({wch: 18}));
    XLSX.utils.book_append_sheet(wb, wsDetail, 'Detail');
  } else {
    // All mode → Sheet 2: Summary by Month (pivot MPN × Customer × Month)
    const monthSet = new Set();
    const dateSet  = new Set();
    parts.forEach(p => {
      Object.keys(p.customers).forEach(cust => {
        (state.data[cust] || []).forEach(r => {
          const rMpn  = (r.mpn  || '').trim();
          const rPart = (r.part || '').trim();
          const matches = (rMpn && p.mpn && rMpn === p.mpn) ||
                          (p.parts && rPart && p.parts.has(rPart)) ||
                          (!p.mpn && rPart === p.partList);
          if(!matches) return;
          const mk = monthKey(r.planDate || r.date || '');
          if(mk) monthSet.add(mk);
          const dk = r.planDate || r.date || '';
          if(dk) dateSet.add(dk);
        });
      });
    });
    const months    = [...monthSet].sort();
    const allDatesA = [...dateSet].sort();
    const MONTH_EN  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const fmtM  = mk => { const [y,m] = mk.split('-').map(Number); return `${MONTH_EN[(m||1)-1]} ${y}`; };

    // helper: match fn
    const rowMatchesPart = (r, p) => {
      const rMpn  = (r.mpn  || '').trim();
      const rPart = (r.part || '').trim();
      return (rMpn && p.mpn && rMpn === p.mpn) ||
             (p.parts && rPart && p.parts.has(rPart)) ||
             (!p.mpn && rPart === p.partList);
    };

    // ── Sheet 2: Summary by Month ──
    const monthHeader = ['MPN', 'Part No.', 'Customer', ...months.map(fmtM), 'Total'];
    const monthRows   = [];
    parts.forEach(p => {
      const custs = [...new Set(Object.keys(p.customers))].sort();
      const partTotals = {};
      custs.forEach(cust => {
        const monthQtys = months.map(mk => {
          let sum = 0;
          (state.data[cust] || []).forEach(r => {
            if(!rowMatchesPart(r, p)) return;
            if(monthKey(r.planDate || r.date || '') === mk) sum += parseQty(r.qty);
          });
          return sum || '';
        });
        const total = monthQtys.reduce((s,v) => s + (Number(v)||0), 0);
        if(total > 0){
          monthRows.push([p.mpn||'', p.partList||'', cust, ...monthQtys, total]);
          months.forEach((mk,i) => { partTotals[mk] = (partTotals[mk]||0) + (Number(monthQtys[i])||0); });
        }
      });
      if(custs.length > 1){
        const subVals = months.map(mk => partTotals[mk]||'');
        const sub = subVals.reduce((s,v)=>s+(Number(v)||0),0);
        if(sub > 0) monthRows.push([p.mpn||'', p.partList||'', '── Subtotal ──', ...subVals, sub]);
      }
    });
    const grandM = months.map((_,i) =>
      monthRows.filter(r => r[2] !== '── Subtotal ──').reduce((s,r)=>s+(Number(r[3+i])||0),0));
    monthRows.push(['','','GRAND TOTAL', ...grandM, grandM.reduce((s,v)=>s+v,0)]);
    const wsMonth = XLSX.utils.aoa_to_sheet([monthHeader, ...monthRows]);
    wsMonth['!cols'] = monthHeader.map((_,i) => ({wch: i<3?18:14}));
    XLSX.utils.book_append_sheet(wb, wsMonth, 'Summary by Month');

    // ── Sheet 3: By Date (pivot MPN × Customer × Plan Date) ──
    if(allDatesA.length > 0){
      const dateHeader = ['MPN', 'Part No.', 'Customer', ...allDatesA, 'Total'];
      const dateRows   = [];
      parts.forEach(p => {
        const custs = [...new Set(Object.keys(p.customers))].sort();
        const partDateTotals = {};
        custs.forEach(cust => {
          const dateQtys = allDatesA.map(dk => {
            let sum = 0;
            (state.data[cust] || []).forEach(r => {
              if(!rowMatchesPart(r, p)) return;
              if((r.planDate || r.date || '') === dk) sum += parseQty(r.qty);
            });
            return sum || '';
          });
          const total = dateQtys.reduce((s,v) => s + (Number(v)||0), 0);
          if(total > 0){
            dateRows.push([p.mpn||'', p.partList||'', cust, ...dateQtys, total]);
            allDatesA.forEach((dk,i) => { partDateTotals[dk] = (partDateTotals[dk]||0) + (Number(dateQtys[i])||0); });
          }
        });
        if(custs.length > 1){
          const subVals = allDatesA.map(dk => partDateTotals[dk]||'');
          const sub = subVals.reduce((s,v)=>s+(Number(v)||0),0);
          if(sub > 0) dateRows.push([p.mpn||'', p.partList||'', '── Subtotal ──', ...subVals, sub]);
        }
      });
      const grandD = allDatesA.map((_,i) =>
        dateRows.filter(r => r[2] !== '── Subtotal ──').reduce((s,r)=>s+(Number(r[3+i])||0),0));
      dateRows.push(['','','GRAND TOTAL', ...grandD, grandD.reduce((s,v)=>s+v,0)]);
      const wsDate = XLSX.utils.aoa_to_sheet([dateHeader, ...dateRows]);
      wsDate['!cols'] = dateHeader.map((_,i) => ({wch: i<3?18:12}));
      XLSX.utils.book_append_sheet(wb, wsDate, 'By Date');
    }
  }

  /* ── Sheet 3 (month mode only): By Date pivot ── */
  if(filterMonth && allDates.length > 0){
    const pivotHeader = ['MPN', 'Part No.', 'Customer', ...allDates];
    const pivotRows = [];
    parts.forEach(p => {
      Object.entries(p.customers).sort((a,b) => a[0].localeCompare(b[0])).forEach(([cust]) => {
        const dateCols = allDates.map(dateStr => {
          let dQty = 0;
          (state.data[cust] || []).forEach(r => {
            if((r.planDate || '') !== dateStr) return;
            const rMpn  = (r.mpn  || '').trim();
            const rPart = (r.part || '').trim();
            if(rMpn === (p.mpn||'') || (p.parts && p.parts.has(rPart)) || (!p.mpn && rPart === p.partList))
              dQty += parseQty(r.qty);
          });
          return dQty || '';
        });
        pivotRows.push([p.mpn||'', p.partList||'', cust, ...dateCols]);
      });
    });
    const wsPivot = XLSX.utils.aoa_to_sheet([pivotHeader, ...pivotRows]);
    wsPivot['!cols'] = pivotHeader.map(() => ({ wch: 16 }));
    XLSX.utils.book_append_sheet(wb, wsPivot, 'By Date');
  }

  const suffix = filterMonth ? `-${filterMonth}` : '';
  XLSX.writeFile(wb, `part-catalogue${suffix}-${stamp}.xlsx`);
  showToast('Exported Part Catalogue');
}

function buildPartGroupedCards(parts, filterMonth){
  if(parts.length === 0) return `<div class="cat-empty">No parts found</div>`;
  return parts.map(p => {
    const strip = STRIP_COLORS[p.colorIdx];
    const custRows = Object.entries(p.customers)
      .sort((a,b) => a[0].localeCompare(b[0], 'en', {sensitivity:'base'}))
      .map(([name, info]) => {
        const badges = [];
        if(info.qtyShipped > 0) badges.push(`<span class="cat-pill cat-pill-shipped">Shipped ${info.qtyShipped.toLocaleString()}</span>`);
        if(info.qtyPending > 0) badges.push(`<span class="cat-pill cat-pill-pending">Pending ${info.qtyPending.toLocaleString()}</span>`);
        const other = info.qty - info.qtyShipped - info.qtyPending;
        if(other > 0) badges.push(`<span class="cat-pill" style="background:#F3F5F8;color:var(--muted);">No Status ${other.toLocaleString()}</span>`);
        const dateLine = (filterMonth && info.planDates.length > 0)
          ? `<div style="font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:3px;">${
              info.planDates.sort().map(d => {
                const pd = parseDate(d);
                const dayNum = pd ? pd.getDate() : d;
                return `<span class="cat-date-chip" data-date="${escapeAttr(d)}" data-customer="${escapeAttr(name)}" title="View items on ${formatThaiDate(d)}">📅 ${dayNum}</span>`;
              }).join(' ')
            }</div>`
          : '';
        return `
          <div class="cat-cust-row">
            <div style="flex:1;min-width:0;">
              <div class="cat-cust-name">${escapeHtml(name)}</div>
              ${badges.length ? `<div class="cat-pills">${badges.join('')}</div>` : ''}
              ${dateLine}
            </div>
            <span class="cat-cust-qty">${info.qty > 0 ? info.qty.toLocaleString() : '—'}</span>
          </div>`;
      }).join('');

    const qtyDisplay = p.totalQty > 0 ? p.totalQty.toLocaleString() : '—';
    const custLabel  = p.custCount === 1 ? '1 customer' : `${p.custCount} customers`;
    const shippedTotal = p.totalShipped > 0 ? `<span class="cat-pill cat-pill-shipped" style="font-size:11px;padding:3px 8px;">Shipped ${p.totalShipped.toLocaleString()}</span>` : '';
    const pendingTotal = p.totalPending > 0 ? `<span class="cat-pill cat-pill-pending" style="font-size:11px;padding:3px 8px;">Pending ${p.totalPending.toLocaleString()}</span>` : '';

    return `
      <div class="cat-card" data-key="${escapeAttr(p.key)}">
        <input type="checkbox" class="cat-card-checkbox" data-key="${escapeAttr(p.key)}" title="เลือก MPN นี้">
        <div class="cat-color-strip" style="background:${strip};"></div>
        <div class="cat-card-head">
          <div>
            <div class="cat-part-name">${escapeHtml(p.mpn || p.partList)}</div>
            ${p.mpn && p.partList ? `<div class="cat-mpn">PN: ${escapeHtml(p.partList)}</div>` : ''}
          </div>
          <div style="text-align:right;">
            <div class="cat-qty-badge">Qty ${qtyDisplay}</div>
            <div style="font-size:10.5px;color:var(--muted);margin-top:4px;font-family:var(--mono);">${custLabel}</div>
          </div>
        </div>
        <div class="cat-customers">${custRows}</div>
        ${(shippedTotal || pendingTotal) ? `<div class="cat-card-foot" style="border-top:1px solid var(--border);gap:6px;">${shippedTotal}${pendingTotal}</div>` : ''}
      </div>`;
  }).join('');
}

function buildCustomerGroupedCards(parts, filterMonth){
  // Re-pivot: group by customer name, list each MPN/Part as a detail row
  const custMap = {};
  parts.forEach(p => {
    Object.entries(p.customers).forEach(([custName, info]) => {
      if(!custMap[custName]){
        custMap[custName] = {
          name: custName,
          totalQty: 0, totalShipped: 0, totalPending: 0,
          mpnCount: 0,
          items: [],
          colorIdx: Object.keys(custMap).length % STRIP_COLORS.length
        };
      }
      const c = custMap[custName];
      c.totalQty     += info.qty;
      c.totalShipped += info.qtyShipped;
      c.totalPending += info.qtyPending;
      c.mpnCount++;
      c.items.push({
        key: p.key, mpn: p.mpn, partList: p.partList,
        qty: info.qty, qtyShipped: info.qtyShipped, qtyPending: info.qtyPending,
        planDates: info.planDates || []
      });
    });
  });

  const customers = Object.values(custMap).sort((a,b) => a.name.localeCompare(b.name, 'en', {sensitivity:'base'}));
  if(customers.length === 0) return `<div class="cat-empty">No customers found</div>`;

  return customers.map(c => {
    const strip = STRIP_COLORS[c.colorIdx];
    const itemRows = c.items
      .sort((a,b) => (a.mpn || a.partList).localeCompare(b.mpn || b.partList, 'en', {sensitivity:'base'}))
      .map(item => {
        const badges = [];
        if(item.qtyShipped > 0) badges.push(`<span class="cat-pill cat-pill-shipped">Shipped ${item.qtyShipped.toLocaleString()}</span>`);
        if(item.qtyPending > 0) badges.push(`<span class="cat-pill cat-pill-pending">Pending ${item.qtyPending.toLocaleString()}</span>`);
        const other = item.qty - item.qtyShipped - item.qtyPending;
        if(other > 0) badges.push(`<span class="cat-pill" style="background:#F3F5F8;color:var(--muted);">No Status ${other.toLocaleString()}</span>`);
        const dateLine = (filterMonth && item.planDates.length > 0)
          ? `<div style="font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:3px;">${
              item.planDates.sort().map(d => {
                const pd = parseDate(d);
                const dayNum = pd ? pd.getDate() : d;
                return `<span class="cat-date-chip" data-date="${escapeAttr(d)}" data-customer="${escapeAttr(c.name)}" title="View items on ${formatThaiDate(d)}">📅 ${dayNum}</span>`;
              }).join(' ')
            }</div>`
          : '';
        const mpnDisplay = item.mpn || item.partList;
        const pnLine = item.mpn && item.partList ? ` <span style="font-weight:400;color:var(--muted);font-size:10.5px;">(PN: ${escapeHtml(item.partList)})</span>` : '';
        return `
          <div class="cat-cust-row">
            <div style="flex:1;min-width:0;">
              <div class="cat-cust-name">${escapeHtml(mpnDisplay)}${pnLine}</div>
              ${badges.length ? `<div class="cat-pills">${badges.join('')}</div>` : ''}
              ${dateLine}
            </div>
            <span class="cat-cust-qty">${item.qty > 0 ? item.qty.toLocaleString() : '—'}</span>
          </div>`;
      }).join('');

    const qtyDisplay = c.totalQty > 0 ? c.totalQty.toLocaleString() : '—';
    const mpnLabel = c.mpnCount === 1 ? '1 MPN' : `${c.mpnCount} MPNs`;
    const shippedTotal = c.totalShipped > 0 ? `<span class="cat-pill cat-pill-shipped" style="font-size:11px;padding:3px 8px;">Shipped ${c.totalShipped.toLocaleString()}</span>` : '';
    const pendingTotal = c.totalPending > 0 ? `<span class="cat-pill cat-pill-pending" style="font-size:11px;padding:3px 8px;">Pending ${c.totalPending.toLocaleString()}</span>` : '';

    return `
      <div class="cat-card" data-customer-key="${escapeAttr(c.name)}">
        <div class="cat-color-strip" style="background:${strip};"></div>
        <div class="cat-card-head">
          <div>
            <div class="cat-part-name">${escapeHtml(c.name)}</div>
          </div>
          <div style="text-align:right;">
            <div class="cat-qty-badge">Qty ${qtyDisplay}</div>
            <div style="font-size:10.5px;color:var(--muted);margin-top:4px;font-family:var(--mono);">${mpnLabel}</div>
          </div>
        </div>
        <div class="cat-customers">${itemRows}</div>
        ${(shippedTotal || pendingTotal) ? `<div class="cat-card-foot" style="border-top:1px solid var(--border);gap:6px;">${shippedTotal}${pendingTotal}</div>` : ''}
      </div>`;
  }).join('');
}

function renderCatalogue(search = '', sortBy = 'part', filterMonth = '', filterCustomer = ''){
  const overlay = document.getElementById('catalogueOverlay');
  const allParts = buildCatalogueData(filterMonth);
  const allMonths = getAllMonths();

  // Filter by search
  const sq = search.toLowerCase();
  let parts = sq
    ? allParts.filter(p => (p.part||'').toLowerCase().includes(sq) || (p.mpn||'').toLowerCase().includes(sq)
        || (p.partList||'').toLowerCase().includes(sq)
        || Object.keys(p.customers).some(c => c.toLowerCase().includes(sq)))
    : allParts;

  // Filter by customer — keep only that customer's data per card
  if(filterCustomer){
    parts = parts
      .map(p => {
        if(!p.customers[filterCustomer]) return null;
        const info = p.customers[filterCustomer];
        return {
          ...p,
          customers:    { [filterCustomer]: info },
          totalQty:     info.qty,
          totalShipped: info.qtyShipped,
          totalPending: info.qtyPending,
          custCount:    1
        };
      })
      .filter(Boolean);
  }

  // Sort
  if(sortBy === 'qty') parts.sort((a,b) => b.totalQty - a.totalQty);
  else if(sortBy === 'customers') parts.sort((a,b) => b.custCount - a.custCount);
  else parts.sort((a,b) => a.part.localeCompare(b.part, 'en', {sensitivity:'base'}));

  const totalParts     = allParts.length;
  const totalCustomers = new Set(allParts.flatMap(p => Object.keys(p.customers))).size;
  const totalQtyFiltered = allParts.reduce((s,p) => s + p.totalQty, 0);

  // Month pills
  const monthPillsHtml = allMonths.map(mk => `
    <button class="cat-month-pill ${mk === filterMonth ? 'active' : ''}" data-month="${mk}">
      ${monthLabel(mk)}
    </button>`).join('');

  const cardsHtml = sortBy === 'customers'
    ? buildCustomerGroupedCards(parts, filterMonth)
    : buildPartGroupedCards(parts, filterMonth);

  overlay.innerHTML = `
    <div class="catalogue-shell">
      <div class="catalogue-head">
        <div>
          <h2>📊 Part Catalogue</h2>
          <p>Summary across all sheets · all customers${filterMonth ? ` · ${monthLabel(filterMonth)}` : ''}</p>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <button class="cat-close-btn" style="background:rgba(255,255,255,.1);padding:8px 14px;font-size:12.5px;border-radius:8px;" id="catExportCustBtn">⬇ Export by Customer</button>
          ${sortBy !== 'customers' ? `<button class="cat-close-btn" style="background:rgba(255,255,255,.1);padding:8px 14px;font-size:12.5px;border-radius:8px;" id="catExportBtn">⬇ Export MPN</button>` : ''}
          <button class="cat-close-btn" id="catCloseBtn">✕ Close</button>
        </div>
      </div>
      <div class="cat-export-bar" id="catExportBar">
        <div class="cat-export-bar-label"><strong id="catSelectedCount">0</strong> MPN selected</div>
        <button class="btn btn-ghost btn-sm" style="color:#fff;border-color:rgba(255,255,255,.2);font-size:12px;" id="catSelectAll">Select All</button>
        <button class="btn btn-ghost btn-sm" style="color:#fff;border-color:rgba(255,255,255,.2);font-size:12px;" id="catSelectNone">Clear</button>
        <button class="btn btn-accent btn-sm" style="font-size:12px;" id="catExportSelected">⬇ Export Selected</button>
        <button class="btn btn-ghost btn-sm" style="color:#A9B4C9;border-color:rgba(255,255,255,.1);font-size:12px;" id="catCancelSelect">Cancel</button>
      </div>
      <div class="cat-summary-bar">
        <div class="cat-stat"><span class="cat-stat-val">${totalParts.toLocaleString()}</span><span class="cat-stat-lbl">Total Parts</span></div>
        <div class="cat-stat"><span class="cat-stat-val">${totalQtyFiltered > 0 ? totalQtyFiltered.toLocaleString() : '—'}</span><span class="cat-stat-lbl">Total Qty${filterMonth ? ' (filtered)' : ''}</span></div>
        <div class="cat-stat"><span class="cat-stat-val">${totalCustomers.toLocaleString()}</span><span class="cat-stat-lbl">Customers</span></div>
      </div>
      ${allMonths.length > 0 ? `
      <div class="cat-month-bar">
        <button class="cat-month-pill ${!filterMonth ? 'active' : ''}" data-month="">All</button>
        ${monthPillsHtml}
      </div>` : ''}
      <div class="catalogue-controls">
        <input type="text" class="catalogue-search" id="catSearch" placeholder="🔍 Search Part No., MPN, Customer..." value="${escapeAttr(search)}">

    searchTimer = setTimeout(() => renderCatalogue(searchEl.value, sortEl.value, filterMonth, custEl?.value||''), 250);
  });
  sortEl.addEventListener('change', () => renderCatalogue(searchEl.value, sortEl.value, filterMonth, custEl?.value||''));
  custEl?.addEventListener('change', () => renderCatalogue(searchEl.value, sortEl.value, filterMonth, custEl.value));

  searchEl.focus();
}

function enterCatSelectMode(overlay, parts, filterMonth){
  const grid    = overlay.querySelector('.catalogue-grid');
  const bar     = document.getElementById('catExportBar');
  const counter = document.getElementById('catSelectedCount');
  if(!grid) return;

  grid.classList.add('cat-select-mode');
  bar.classList.add('show');
  document.getElementById('catExportBtn').style.display = 'none';

  function updateCount(){
    const n = grid.querySelectorAll('.cat-card.selected').length;
    counter.textContent = n;
    document.getElementById('catExportSelected').disabled = n === 0;
  }

  // Click card → toggle selection
  grid.querySelectorAll('.cat-card').forEach(card => {
    const chk = card.querySelector('.cat-card-checkbox');
    if(!chk) return; // customer-grouped cards have no checkbox / not selectable for export
    const toggle = () => {
      card.classList.toggle('selected');
      chk.checked = card.classList.contains('selected');
      updateCount();
    };
    card.addEventListener('click', toggle);
    chk.addEventListener('click', e => { e.stopPropagation(); toggle(); });
  });

  document.getElementById('catSelectAll').addEventListener('click', () => {
    grid.querySelectorAll('.cat-card').forEach(c => {
      c.classList.add('selected');
      c.querySelector('.cat-card-checkbox').checked = true;
    });
    updateCount();
  });

  document.getElementById('catSelectNone').addEventListener('click', () => {
    grid.querySelectorAll('.cat-card').forEach(c => {
      c.classList.remove('selected');
      c.querySelector('.cat-card-checkbox').checked = false;
    });
    updateCount();
  });

  document.getElementById('catExportSelected').addEventListener('click', () => {
    const selectedKeys = new Set(
      [...grid.querySelectorAll('.cat-card.selected')].map(c => c.dataset.key)
    );
    const selectedParts = parts.filter(p => selectedKeys.has(p.key));
    if(selectedParts.length === 0) return;
    exportCatalogue(selectedParts, filterMonth);
    exitCatSelectMode(overlay);
  });

  document.getElementById('catCancelSelect').addEventListener('click', () => exitCatSelectMode(overlay));
}

function exitCatSelectMode(overlay){
  const grid = overlay?.querySelector('.catalogue-grid');
  if(!grid) return;
  grid.classList.remove('cat-select-mode');
  grid.querySelectorAll('.cat-card').forEach(c => {
    c.classList.remove('selected');
    const chk = c.querySelector('.cat-card-checkbox');
    if(chk) chk.checked = false;
  });
  document.getElementById('catExportBar')?.classList.remove('show');
  const btn = document.getElementById('catExportBtn');
  if(btn) btn.style.display = '';
}

function parseDate(str){
  if(!str) return null;
  const d = new Date(str + 'T00:00:00');
  return isNaN(d.getTime()) ? null : d;
}

function daysBetween(a, b){
  const MS = 24 * 60 * 60 * 1000;
  return Math.round((b - a) / MS);
}

function computeAlerts(){
  const today = new Date();
  today.setHours(0,0,0,0);
  const alerts = [];
  state.customers.forEach(customer => {
    (state.data[customer] || []).forEach((r, idx) => {
      if(!r.planDate) return;
      if(r.status === 'shipped') return;
      const plan = parseDate(r.planDate);
      if(!plan) return;
      const diff = daysBetween(today, plan);
      if(diff <= 3){
        alerts.push({ customer, idx, planDate: r.planDate, part: r.part, po: r.po, diff });
      }
    });
  });
  // overdue first, then soonest
  alerts.sort((a, b) => a.diff - b.diff);
  return alerts;
}

function formatThaiDate(str){
  const d = parseDate(str);
  if(!d) return str;
  const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return d.getDate() + ' ' + months[d.getMonth()] + ' ' + (d.getFullYear() + 543);
}

   📋 DAY SUMMARY — click a Plan Date cell to see all items
   shipping that day across all customers
   ============================================================ */

let dayPopupOutside = null;

function buildDaySummary(dateStr){
  // Collect all rows (all customers) with matching planDate
  const items = [];
  state.customers.forEach(customer => {
    (state.data[customer] || []).forEach((r, idx) => {
      if((r.planDate || '') === dateStr){
        items.push({ customer, idx, r });
      }
    });
  });
  return items;
}

function openDaySummary(dateStr, anchorEl){
  const popup = document.getElementById('daySummaryPopup');
  if(!dateStr){ popup.style.display = 'none'; return; }

  const items = buildDaySummary(dateStr);
  if(items.length === 0){ popup.style.display = 'none'; return; }

  const totalQty = items.reduce((s, {r}) => s + (parseQty(r.qty)), 0);
  const dateDisplay = formatThaiDate(dateStr);

  const rowsHtml = items.map(({customer, idx, r}, i) => {
    const color = STRIP_COLORS[i % STRIP_COLORS.length];
    const qty   = parseQty(r.qty);
    const statusHtml = r.status === 'shipped'
      ? `<span class="day-popup-status shipped">ส่งแล้ว</span>`
      : r.status === 'pending'
      ? `<span class="day-popup-status pending">รอจัดส่ง</span>` : '';
    const meta = [customer, r.po ? `PO ${r.po}` : '', r.forwarder || ''].filter(Boolean).join(' · ');
    return `
      <div class="day-popup-row">
        <div class="day-popup-dot" style="background:${color};"></div>
        <div class="day-popup-info">
          <div class="day-popup-pn">${escapeHtml(r.part || '—')}${r.mpn ? ` <span style="font-weight:400;color:var(--muted);">(${escapeHtml(r.mpn)})</span>` : ''}</div>
          <div class="day-popup-meta">${escapeHtml(meta)}</div>
          ${statusHtml}
        </div>
        <div class="day-popup-qty">${qty > 0 ? qty.toLocaleString() : '—'}</div>
      </div>`;
  }).join('');

  popup.innerHTML = `
    <div class="day-popup-head">
      <div>
        <h4>📋 ${dateDisplay}</h4>
        <p>${items.length} รายการ · วันที่ Plan จัดส่ง</p>
      </div>
      <button class="day-popup-close" id="dayPopupClose">✕</button>
    </div>
    <div class="day-popup-body">
      <div class="day-popup-total">
        <span>รวม Q'ty ทั้งหมด</span>
        <strong>${totalQty > 0 ? totalQty.toLocaleString() : '—'}</strong>
      </div>
      ${rowsHtml}
    </div>`;

  // Position near the anchor
  const rect = anchorEl.getBoundingClientRect();
  const popW = 340, popH = 400;
  let top  = rect.bottom + 8;
  let left = rect.left;
  if(left + popW > window.innerWidth - 12) left = window.innerWidth - popW - 12;
  if(top + popH  > window.innerHeight - 12) top  = rect.top - popH - 8;
  popup.style.top  = top  + 'px';
  popup.style.left = left + 'px';
  popup.style.display = 'flex';

  document.getElementById('dayPopupClose').addEventListener('click', () => {
    popup.style.display = 'none';
    document.removeEventListener('click', dayPopupOutside);
  });

  // Close when clicking outside
  if(dayPopupOutside) document.removeEventListener('click', dayPopupOutside);
  dayPopupOutside = e => {
    if(!popup.contains(e.target) && !anchorEl.contains(e.target)){
      popup.style.display = 'none';
      document.removeEventListener('click', dayPopupOutside);
    }
  };
  setTimeout(() => document.addEventListener('click', dayPopupOutside), 0);
}

function renderAlerts(){
  const banner = document.getElementById('alertBanner');
  const alerts = computeAlerts();
  if(alerts.length === 0){ banner.innerHTML = ''; return; }
  const hasOverdue = alerts.some(a => a.diff < 0);
  const itemsHtml = alerts.map(a => {
    const overdue = a.diff < 0;
    const badge = overdue ? `เลยกำหนด ${Math.abs(a.diff)} วัน` : (a.diff === 0 ? 'วันนี้' : `อีก ${a.diff} วัน`);
    const partLabel = a.part ? `Part No. ${escapeHtml(a.part)}` : 'ไม่มี Part No.';
    const poLabel = a.po ? ` · PO ${escapeHtml(a.po)}` : '';
    return `
      <div class="alert-item ${overdue ? 'overdue' : ''}"
           data-customer="${escapeAttr(a.customer)}"
           data-row-idx="${a.idx}">
        <span class="alert-badge">${badge}</span>
        <span class="alert-cust">${escapeHtml(a.customer)}</span>
        <span class="alert-meta">${partLabel}${poLabel} · Plan ${formatThaiDate(a.planDate)}</span>
        <button class="alert-link">ไปที่รายการนี้ ↗</button>
      </div>`;
  }).join('');

  banner.innerHTML = `
    <div class="alert-banner ${hasOverdue ? 'has-overdue' : ''}">
      <div class="alert-banner-head"><span>⏰</span><span>แจ้งเตือน: มีรายการที่ใกล้ถึงวัน Plan จัดส่ง (ภายใน 3 วัน)</span></div>
      <div class="alert-list">${itemsHtml}</div>
    </div>`;

  banner.querySelectorAll('.alert-item').forEach(el => {
    el.querySelector('.alert-link').addEventListener('click', () => {
      const customer = el.dataset.customer;
      const rowIdx   = parseInt(el.dataset.rowIdx, 10);

      if(state.active !== customer){
        state.active = customer;
        filterState = {};
        colHiddenValues = {};
        saveState();
        renderAll();
      }

      // After render, find exact tr by data-row-idx and scroll+highlight
      setTimeout(() => {
        const tbody = document.getElementById('tbody');
        if(!tbody) return;
        const targetTr = tbody.querySelector(`tr[data-row-idx="${rowIdx}"]`);
        if(targetTr){
          targetTr.scrollIntoView({ behavior:'smooth', block:'center' });
          targetTr.classList.remove('alert-highlight');
          void targetTr.offsetWidth;
          targetTr.classList.add('alert-highlight');
          setTimeout(() => targetTr.classList.remove('alert-highlight'), 2200);
        }
      }, 80);
    });
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){
  return escapeHtml(s || '');
}

function buildSheetData(customerName){
  const rows = state.data[customerName] || [];
  const data = [['Part No.', 'MPN', 'เลข PO', "Q'ty", 'SO', 'DO', 'วันที่ Plan จัดส่ง', 'วันที่จัดส่ง', 'Ship Mode', 'Forwarder', 'เลข Tracking', 'INV', 'Status', 'Noted']];
  rows.forEach(r => {
    if(rowHasData(r)){
      data.push([
        r.part || '',
        r.mpn || '',
        r.po || '',
        r.qty || '',
        r.so || '',
        r.do || '',
        r.planDate || '',
        r.date || '',
        r.shipMode || '',
        r.forwarder || '',
        r.tracking || '',
        r.inv || '',
        statusMeta(r.status).label.replace('— เลือกสถานะ —', ''),
        r.note || ''
      ]);
    }
  });
  if(data.length === 1) data.push(data[0].map(() => ''));
  return data;
}

function sanitizeSheetName(name){
  let n = name.replace(/[\\\/\?\*\[\]:]/g, ' ').trim();
  if(n.length > 31) n = n.substring(0, 31);
  return n || 'Sheet';
}

function exportExcel(all){
  const wb = XLSX.utils.book_new();
  const usedNames = new Set();

  const targets = all ? state.customers : [state.active];
  targets.forEach(name => {
    const ws = XLSX.utils.aoa_to_sheet(buildSheetData(name));
    ws['!cols'] = COLUMN_WIDTHS_EXPORT;
    let sheetName = sanitizeSheetName(name);
    let finalName = sheetName;
    let i = 2;
    while(usedNames.has(finalName)){
      finalName = sanitizeSheetName(sheetName + ' ' + i);
      i++;
    }
    usedNames.add(finalName);
    XLSX.utils.book_append_sheet(wb, ws, finalName);
  });

  const today = new Date();
  const stamp = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  const filename = all
    ? `shipment-records-all-${stamp}.xlsx`
    : `shipment-records-${sanitizeSheetName(state.active)}-${stamp}.xlsx`;

  XLSX.writeFile(wb, filename);
  showToast('Export สำเร็จ: ' + filename);
}

document.getElementById('exportAllBtn').addEventListener('click', () => exportExcel(true));

/* ============================================================
   🔄 UPDATE BY PO
   Matches incoming rows by PO, updates SO / DO / INV / and
   other selected fields only — leaves unmatched rows untouched.
   ============================================================ */

// Fields the user can choose to update (PO is the key, not updatable)
const UPDATE_FIELDS = [
  { field:'so',       label:'SO' },
  { field:'do',       label:'DO' },
  { field:'inv',      label:'INV' },
  { field:'tracking', label:'Tracking' },
  { field:'date',     label:'วันที่จัดส่ง' },
  { field:'shipMode', label:'Ship Mode' },
  { field:'forwarder',label:'Forwarder' },
  { field:'status',   label:'Status' },
  { field:'note',     label:'Noted' },
];

// Header aliases for the PO-update upload (PO is mandatory key)
const UPDATE_HEADER_MAP = {
  'เลข po':'po','po':'po','po no.':'po','po no':'po',
  'so':'so','เลข so':'so','so no.':'so',
  'do':'do','เลข do':'do','do no.':'do',
  'inv':'inv','invoice':'inv','inv no.':'inv','invoice no.':'inv',
  "q'ty":'qty','qty':'qty','quantity':'qty','จำนวน':'qty',
  'เลข tracking':'tracking','tracking':'tracking','tracking no.':'tracking','tracking no':'tracking',
  'วันที่จัดส่ง':'date','ship date':'date','shipping date':'date','date':'date',
  'ship mode':'shipMode','shipmode':'shipMode',
  'forwarder':'forwarder','fwd':'forwarder',
  'status':'status','สถานะ':'status',
  'noted':'note','note':'note','notes':'note','หมายเหตุ':'note','remark':'note',
};

let pendingPoUpdate = null;  // { incomingRows, scopeFields }

function parsePoUpdateSheet(ws){
  const arrStr = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:false});
  const arrRaw = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:true});
  if(arrStr.length < 2) return [];
  // Build column map
  const headerRow = arrStr[0];
  const colMap = {};
  headerRow.forEach((h, i) => {
    const key = UPDATE_HEADER_MAP[normHeader(h)];
    if(key) colMap[key] = i;
  });
  const rows = [];
  for(let i = 1; i < arrStr.length; i++){
    const s = arrStr[i]; const raw = arrRaw[i] || [];
    const po = s[colMap['po'] ?? -1];
    if(!po || String(po).trim() === '') continue;
    const row = { po: String(po).trim() };

    // ── Tiebreaker key fields (always read, not updatable) ──
    // Use raw number for qty to avoid string/number mismatch
    ['qty','so','do','inv'].forEach(key => {
      const ci = colMap[key];
      if(ci === undefined) return;
      if(key === 'qty'){
        const rawVal = raw[ci];
        row[key] = (rawVal !== undefined && rawVal !== '') ? String(rawVal).trim() : String(s[ci] ?? '').trim();
      } else {
        row[key] = String(s[ci] ?? '').trim();
      }
    });

    // ── Updatable fields ──
    UPDATE_FIELDS.forEach(({field}) => {
      const ci = colMap[field];
      if(ci === undefined) return;
      if(field === 'date'){
        row[field] = normalizeDateValue((typeof raw[ci] === 'number' && (!s[ci] || s[ci] === String(raw[ci]))) ? raw[ci] : s[ci]);
      } else if(field === 'status'){
        row[field] = mapStatusLabelToValue(s[ci]);
      } else if(field === 'shipMode'){
        row[field] = mapShipModeValue(s[ci]);
      } else {
        row[field] = String(s[ci] ?? '').trim();
      }
    });
    rows.push(row);
  }
  return rows;
}

function normalizeQty(v){
  // Strip trailing .0, commas, spaces — compare as integer-like string
  if(v === null || v === undefined || v === '') return '';
  const n = parseFloat(String(v).replace(/,/g,'').trim());
  return isNaN(n) ? String(v).trim() : String(n);
}

function computePoMatches(incomingRows, scopeFields, customer){
  const systemRows = state.data[customer] || [];

  const poMap = {};
  systemRows.forEach((r, idx) => {
    const po = (r.po || '').trim();
    if(!po) return;
    if(!poMap[po]) poMap[po] = [];
    poMap[po].push(idx);
  });

  const matched   = [];
  const unmatched = [];
  const needsManual = [];

  incomingRows.forEach(inc => {
    const idxList = poMap[inc.po];
    if(!idxList){ unmatched.push(inc); return; }

    const incQty = normalizeQty(inc.qty);
    const incInv = (inc.inv || '').trim();
    const incSo  = (inc.so  || '').trim();
    const incDo  = (inc.do  || '').trim();

    let targets = [...idxList];
    let matchBy = 'PO only';

    // Each tiebreaker: narrow targets, stop as soon as we reach 1
    function tryNarrow(filterFn, label){
      if(targets.length <= 1) return;
      const t = targets.filter(filterFn);
      if(t.length > 0 && t.length < targets.length){
        targets = t;
        matchBy = label;
      }
    }

    // Priority order: SO first, then DO, then Qty, then INV
    if(incSo) tryNarrow(
      i => (systemRows[i].so||'').trim() === incSo,
      'PO + SO'
    );
    if(incDo) tryNarrow(
      i => (systemRows[i].do||'').trim() === incDo,
      matchBy === 'PO + SO' ? 'PO + SO + DO' : 'PO + DO'
    );
    if(incQty) tryNarrow(
      i => normalizeQty(systemRows[i].qty) === incQty,
      matchBy !== 'PO only' ? matchBy + ' + Qty' : 'PO + Qty'
    );
    if(incInv) tryNarrow(
      i => (systemRows[i].inv||'').trim() === incInv,
      matchBy !== 'PO only' ? matchBy + ' + INV' : 'PO + INV'
    );

    if(targets.length > 1){
      needsManual.push({
        inc,
        candidates: targets.map(i => ({ sysIdx: i, row: systemRows[i] })),
        scopeFields,
        matchBy,
      });
      return;
    }

    const sysIdx = targets[0];
    const sys = systemRows[sysIdx];
    const changes = {};
    scopeFields.forEach(field => {
      const newVal = inc[field];
      if(newVal === undefined || newVal === '') return;
      if((sys[field] || '') !== newVal) changes[field] = { old: sys[field] || '', new: newVal };
    });
    matched.push({ po: inc.po, sysIdx, changes, hasChanges: Object.keys(changes).length > 0, matchBy });
  });

  return { matched, unmatched, needsManual };
}

function openPoUpdateModal(incomingRows, customer){

  pendingPoUpdate = { incomingRows, customer };

  const presentFields = UPDATE_FIELDS.filter(({field}) =>
    incomingRows.some(r => r[field] !== undefined && r[field] !== '')
  );

  let manualSelections = {};

  function buildPreview(scopeFields){
    const { matched, unmatched, needsManual } = computePoMatches(incomingRows, scopeFields, customer);
    const updatable = matched.filter(m => m.hasChanges).length;
    const same      = matched.filter(m => !m.hasChanges).length;

    const matchByColor = {
      'PO + Qty + INV': '#1E7A46', 'PO + Qty': '#1B6FAE',
      'PO + INV': '#7B5CF0', 'PO + SO': '#20B2C4', 'PO only': '#9A6B00',
    };

    const autoRows = matched.slice(0, 50).map(m => {
      const changesHtml = Object.entries(m.changes).map(([f]) => {
        const label = UPDATE_FIELDS.find(x => x.field === f)?.label || f;
        return `<span class="update-field-chip">${label}</span>`;
      }).join('');
      const changeDetail = Object.entries(m.changes).map(([f, v]) => {
        const label = UPDATE_FIELDS.find(x => x.field === f)?.label || f;
        return `<div><b>${label}:</b> <span class="update-cell-old">${escapeHtml(v.old||'—')}</span> <span class="update-cell-new">→ ${escapeHtml(v.new)}</span></div>`;
      }).join('');
      const mc = matchByColor[m.matchBy] || '#888';
      const badge = `<span style="font-size:10px;font-weight:600;font-family:var(--mono);color:${mc};background:${mc}18;padding:2px 6px;border-radius:4px;display:inline-block;margin-bottom:4px;">⊕ ${m.matchBy}</span>`;
      const sys = state.data[customer][m.sysIdx];
      const debugLine = `<div style="font-size:10px;color:#999;font-family:var(--mono);margin-top:2px;">แถว ${m.sysIdx+1} | Qty:${sys?.qty||'—'} SO:${sys?.so||'—'} DO:${sys?.do||'—'} INV:${sys?.inv||'—'}</div>`;
      return `<tr class="${m.hasChanges ? 'row-matched' : ''}">
        <td style="font-family:var(--mono);font-weight:600;">${escapeHtml(m.po)}</td>
        <td>${badge}${debugLine}${m.hasChanges
          ? `<div>${changesHtml}</div><div style="margin-top:4px;font-size:11px;">${changeDetail}</div>`
          : `<span class="update-cell-same">ไม่มีการเปลี่ยนแปลง</span>`}</td>
      </tr>`;
    }).join('');

    const unmatchedHtml = unmatched.map(r =>
      `<tr class="row-unmatched"><td style="font-family:var(--mono)">${escapeHtml(r.po)}</td><td style="color:var(--muted);font-size:12px;">ไม่พบ PO นี้ในระบบ</td></tr>`
    ).join('');
    const more = matched.length > 50 ? `<tr><td colspan="2" style="padding:8px 10px;color:var(--muted);font-size:12px;">... และอีก ${matched.length-50} รายการ</td></tr>` : '';

    let manualHtml = '';
    if(needsManual.length > 0){
      const items = needsManual.map((nm, niIdx) => {
        const inc = nm.inc;
        const incDesc = [
          `PO: ${inc.po}`,
          inc.qty ? `Qty: ${inc.qty} (norm: ${normalizeQty(inc.qty)})` : '',
          inc.so  ? `SO: ${inc.so}`   : '',
          inc.do  ? `DO: ${inc.do}`   : '',
          inc.inv ? `INV: ${inc.inv}` : '',
        ].filter(Boolean).join(' · ');

        const opts = nm.candidates.map((cand) => {
          const r = cand.row;
          const desc = [
            r.qty   ? `Qty: ${r.qty} (norm: ${normalizeQty(r.qty)})` : '—',
            r.part  ? `Part: ${r.part}`     : '',
            r.so    ? `SO: ${r.so}`         : '',
            r.do    ? `DO: ${r.do}`         : '',
            r.inv   ? `INV: ${r.inv}`       : '',
            r.planDate ? `Plan: ${r.planDate}` : '',
          ].filter(Boolean).join(' · ');

          const sel = manualSelections[niIdx];
          const checked = sel === cand.sysIdx ? 'checked' : '';
          const pickedClass = sel === cand.sysIdx ? 'picked' : '';
          return `
            <div class="manual-resolve-option ${pickedClass}" data-ni="${niIdx}" data-sysidx="${cand.sysIdx}">
              <input type="radio" name="manual_${niIdx}" value="${cand.sysIdx}" ${checked}>
              <div class="manual-resolve-row-detail">
                <span style="font-weight:700;color:var(--navy);">แถว ${cand.sysIdx + 1}</span> — ${escapeHtml(desc)}
              </div>
            </div>`;
        }).join('');

        const skipSel = manualSelections[niIdx] === -1 ? 'checked' : '';
        const skipPicked = manualSelections[niIdx] === -1 ? 'picked' : '';
        return `
          <div class="manual-resolve-item">
            <div class="manual-resolve-head">⚠ PO: ${escapeHtml(inc.po)} — พบ ${nm.candidates.length} แถวที่อาจตรงกัน</div>
            <div class="manual-resolve-incoming">ข้อมูลจากไฟล์: ${escapeHtml(incDesc || '(ไม่มีข้อมูลเพิ่มเติม)')}</div>
            ${opts}
            <div class="manual-resolve-option ${skipPicked}" data-ni="${niIdx}" data-sysidx="-1">
              <input type="radio" name="manual_${niIdx}" value="-1" ${skipSel}>
              <div class="manual-resolve-row-detail" style="color:var(--muted);">⊘ ข้ามรายการนี้</div>
            </div>
          </div>`;
      }).join('');

      manualHtml = `
        <div class="manual-resolve-section">
          <div class="manual-resolve-title">⚠ ต้องเลือกด้วยตัวเอง (${needsManual.length} รายการ)</div>
          ${items}
        </div>`;
    }

    return { updatable, same, unmatched: unmatched.length, needsManual: needsManual.length,
      tableHtml: autoRows + unmatchedHtml + more, manualHtml, needsManualData: needsManual };
  }

  const scopeChecks = presentFields.map(({field,label}) =>
    `<label class="update-scope-check">
      <input type="checkbox" class="scope-chk" value="${field}" checked>
      ${label}
    </label>`
  ).join('');

  overlay.innerHTML = `
    <div class="modal-overlay" id="poModalInner">
      <div class="modal" style="max-width:640px;">
        <div class="modal-head">
          <div class="modal-icon" style="background:#E3F1FB;color:#1B6FAE;">🔄</div>
          <div>
            <h3>Update by PO — ${escapeHtml(customer)}</h3>
            <p>อัปเดตข้อมูลโดยใช้เลข PO เป็น key จับคู่กับข้อมูลที่มีอยู่</p>
          </div>
        </div>
        <div class="modal-body" style="gap:12px;">
          <div class="update-scope-row">
            <span class="update-scope-label">ฟิลด์ที่จะอัปเดต:</span>
            <div class="update-scope-checks" id="scopeChecks">${scopeChecks}</div>
          </div>
          <div id="updateSummary" class="update-summary"></div>
        </div>
        <div class="modal-body-scroll" id="updatePreviewWrap">
          <div id="manualResolveArea"></div>
          <div class="update-table-wrap" style="margin-top:10px;">
            <table class="update-table">
              <thead><tr><th>PO</th><th>การเปลี่ยนแปลง</th></tr></thead>
              <tbody id="updatePreviewBody"></tbody>
            </table>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-ghost btn-sm" id="poModalCancelBtn">ยกเลิก</button>
          <button class="btn btn-accent btn-sm" id="poModalConfirmBtn">✓ อัปเดต</button>
        </div>
      </div>
    </div>`;

  overlay.style.display = 'block';

  function refresh(){
    const checked = [...overlay.querySelectorAll('.scope-chk:checked')].map(c => c.value);
    manualSelections = {};
    const preview = buildPreview(checked);
    const { updatable, same, needsManual: nm, tableHtml, manualHtml } = preview;

    document.getElementById('updateSummary').innerHTML = `
      <span class="update-badge matched">✓ จับคู่ได้ ${updatable + same} รายการ</span>
      <span class="update-badge updated">🔄 มีการเปลี่ยนแปลง ${updatable} รายการ</span>
      <span class="update-badge skipped">— ไม่เปลี่ยน ${same} รายการ</span>
      ${preview.unmatched ? `<span class="update-badge unmatched">✕ ไม่พบ PO ${preview.unmatched} รายการ</span>` : ''}
      ${nm ? `<span class="update-badge" style="background:#FFF4D6;color:#9A6B00;">⚠ ต้องเลือกเอง ${nm} รายการ</span>` : ''}
    `;
    document.getElementById('updatePreviewBody').innerHTML = tableHtml;
    document.getElementById('manualResolveArea').innerHTML = manualHtml;
    document.getElementById('poModalConfirmBtn').disabled = updatable === 0 && nm === 0;

    overlay.querySelectorAll('.manual-resolve-option').forEach(opt => {
      const radio = opt.querySelector('input[type=radio]');
      const niIdx = parseInt(opt.dataset.ni, 10);
      const sysIdx = parseInt(opt.dataset.sysidx, 10);
      const handler = () => {
        manualSelections[niIdx] = sysIdx;
        overlay.querySelectorAll(`.manual-resolve-option[data-ni="${niIdx}"]`).forEach(o => o.classList.remove('picked'));
        opt.classList.add('picked');
        document.getElementById('poModalConfirmBtn').disabled = false;
      };
      opt.addEventListener('click', () => { radio.checked = true; handler(); });
      radio.addEventListener('change', handler);
    });
  }

  overlay.querySelectorAll('.scope-chk').forEach(c => c.addEventListener('change', refresh));
  refresh();

  document.getElementById('poModalCancelBtn').addEventListener('click', closePoUpdateModal);
  document.getElementById('poModalInner').addEventListener('click', e => {
    if(e.target === e.currentTarget) closePoUpdateModal();
  });
  document.getElementById('poModalConfirmBtn').addEventListener('click', () => {
    const checked = [...overlay.querySelectorAll('.scope-chk:checked')].map(c => c.value);
    const { matched, needsManual } = computePoMatches(incomingRows, checked, customer);
    let updCount = 0;
    const systemRows = state.data[customer];

    matched.forEach(m => {
      if(!m.hasChanges) return;
      Object.entries(m.changes).forEach(([field, v]) => { systemRows[m.sysIdx][field] = v.new; });
      updCount++;
    });

    (needsManual || []).forEach((nm, niIdx) => {
      const sysIdx = manualSelections[niIdx];
      if(sysIdx === undefined || sysIdx === -1) return;
      const sys = systemRows[sysIdx];
      if(!sys) return;
      nm.scopeFields.forEach(field => {
        const newVal = nm.inc[field];
        if(newVal === undefined || newVal === '') return;
        if((sys[field]||'') !== newVal){ sys[field] = newVal; updCount++; }
      });
    });

    state.data[customer] = sortRowsByPlanDate(systemRows);
    saveState();
    closePoUpdateModal();
    state.active = customer;
    renderAll();
    showToast(`อัปเดตสำเร็จ: ${updCount} ฟิลด์ ใน "${customer}" (เรียงตาม Plan Date)`);
  });
}

function closePoUpdateModal(){
  document.getElementById('updatePoModalOverlay').style.display = 'none';
  pendingPoUpdate = null;
}


async function handleUpdateByPoFile(e){
  const file = e.target.files[0];
  if(!file) return;
  e.target.value = '';
  let wb;
  try{
    const buf = await file.arrayBuffer();
    wb = XLSX.read(buf, {type:'array'});
  }catch(err){
    showToast('ไม่สามารถอ่านไฟล์ได้');
    return;
  }
  // Read first non-guide sheet
  const sheetName = wb.SheetNames.find(n => n !== 'คำแนะนำ') || wb.SheetNames[0];
  if(!sheetName){ showToast('ไม่พบ Sheet ในไฟล์'); return; }
  const rows = parsePoUpdateSheet(wb.Sheets[sheetName]);
  if(rows.length === 0){ showToast('ไม่พบข้อมูล PO ในไฟล์นี้ (ต้องมีคอลัมน์ "PO")'); return; }

  // Pick target customer — default to active
  const customers = state.customers;
  if(customers.length === 1){
    openPoUpdateModal(rows, customers[0]);
    return;
  }
  // Let user pick which customer to update against
  const overlay = document.getElementById('updatePoModalOverlay');
  const opts = customers.map(c => `<option value="${escapeAttr(c)}">${escapeHtml(c)}</option>`).join('');
  overlay.innerHTML = `
    <div class="modal-overlay" id="poPickInner">
      <div class="modal" style="max-width:380px;">
        <div class="modal-head">
          <div class="modal-icon" style="background:#E3F1FB;color:#1B6FAE;">🔄</div>
          <div><h3>Update by PO</h3><p>เลือกลูกค้าที่จะอัปเดต (พบ ${rows.length} PO ในไฟล์)</p></div>
        </div>
        <div class="modal-body">
          <div class="import-field-group">
            <label class="import-field-label">อัปเดตข้อมูลของลูกค้า:</label>
            <select id="poCustomerSel" class="import-field-select">${opts}</select>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-ghost btn-sm" id="poPickCancel">ยกเลิก</button>
          <button class="btn btn-accent btn-sm" id="poPickNext">ถัดไป →</button>
        </div>
      </div>
    </div>`;
  overlay.style.display = 'block';
  // Pre-select active customer
  document.getElementById('poCustomerSel').value = state.active;
  document.getElementById('poPickCancel').addEventListener('click', () => {
    overlay.style.display = 'none';
  });
  document.getElementById('poPickNext').addEventListener('click', () => {
    const cust = document.getElementById('poCustomerSel').value;
    openPoUpdateModal(rows, cust);
  });
}
