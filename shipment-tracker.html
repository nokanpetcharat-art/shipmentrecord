function normHeader(h){
  return String(h == null ? '' : h).trim().toLowerCase().replace(/\s+/g, ' ');
}

function pad2(n){ return String(n).padStart(2, '0'); }

function normalizeDateValue(val){
  if(val === null || val === undefined || val === '') return '';

  // JS Date object (cellDates:true path — kept for safety)
  if(val instanceof Date){
    if(isNaN(val.getTime())) return '';
    const y = val.getUTCFullYear();
    const mo = val.getUTCMonth() + 1;
    const d = val.getUTCDate();
    if(y < 1900) return '';
    return y + '-' + pad2(mo) + '-' + pad2(d);
  }

  // Raw Excel serial number — convert via XLSX
  if(typeof val === 'number'){
    if(val < 1) return '';
    try{
      const d = XLSX.SSF.parse_date_code(val);
      if(!d || d.y < 1900) return '';
      return d.y + '-' + pad2(d.m) + '-' + pad2(d.d);
    }catch(e){ return ''; }
  }

  const s = String(val).trim();
  if(!s) return '';

  // Already YYYY-MM-DD
  let m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/);
  if(m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;

  // DD/MM/YYYY or DD-MM-YYYY or DD.MM.YYYY
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if(m) return `${m[3]}-${pad2(m[1])}-${pad2(m[2])}`;

  // Excel formatted string like "20 Jun 2026" or "Jun 20, 2026"
  const parsed = Date.parse(s);
  if(!isNaN(parsed)){
    const d = new Date(parsed);
    const y = d.getFullYear();
    if(y >= 1900){
      // Use local date parts since Date.parse gives local time for date-only strings
      return y + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
    }
  }

  return s;
}

function parseSheetRows(ws){
  // Read with raw:false to get formatted strings (avoids Excel serial/timezone issues),
  // AND raw:true in a second pass to catch numeric serials in cells with no format.
  // Strategy: use formatted string values, fallback to raw number for date cols.
  const arrStr = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:false});
  const arrRaw = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:true});
  if(arrStr.length === 0) return [];
  const colMap = buildHeaderColumnMap(arrStr[0]);
  const rows = [];
  for(let i = 1; i < arrStr.length; i++){
    const rowStr = arrStr[i] || [];
    const rowRaw = arrRaw[i] || [];
    if(rowStr.every(c => c === '' || c === null || c === undefined)) continue;
    const row = emptyRow();
    IMPORT_COLUMNS.forEach(field => {
      const colIdx = colMap[field];
      if(colIdx === undefined) return;
      if(field === 'planDate' || field === 'date'){
        // Prefer formatted string; fall back to raw number for unformatted serial cells
        const strVal = rowStr[colIdx];
        const rawVal = rowRaw[colIdx];
        const dateStr = (typeof rawVal === 'number' && (!strVal || strVal === String(rawVal)))
          ? rawVal
          : strVal;
        row[field] = normalizeDateValue(dateStr);
      } else if(field === 'status'){
        row[field] = mapStatusLabelToValue(rowStr[colIdx]);
      } else if(field === 'shipMode'){
        row[field] = mapShipModeValue(rowStr[colIdx]);
      } else {
        const v = rowStr[colIdx];
        row[field] = (v === null || v === undefined) ? '' : String(v).trim();
      }
    });
    if(!rowIsEmpty(row)) rows.push(row);
  }
  return rows;
}

function mapStatusLabelToValue(val){
  if(val === null || val === undefined) return '';
  const s = String(val).trim();
  if(!s) return '';
  const found = STATUS_OPTIONS.find(o => o.label === s || o.value === s);
  if(found) return found.value;
  const lower = s.toLowerCase();
  const byLower = STATUS_OPTIONS.find(o => o.value && o.value.toLowerCase() === lower);
  if(byLower) return byLower.value;
  return '';
}

function mapShipModeValue(val){
  if(val === null || val === undefined) return '';
  const s = String(val).trim();
  if(!s) return '';
  const lower = s.toLowerCase();
  const found = SHIP_MODE_OPTIONS.find(o => o.value && o.value.toLowerCase() === lower);
  return found ? found.value : s;
}

function buildHeaderColumnMap(headerRow){
  const map = {};
  let matched = 0;
  headerRow.forEach((h, i) => {
    const norm = normHeader(h);
    if(HEADER_MAP[norm]){
      map[HEADER_MAP[norm]] = i;
      matched++;
    }
  });
  if(matched === 0){
    IMPORT_COLUMNS.forEach((field, i) => { map[field] = i; });
  }
  return map;
}

function rowIsEmpty(obj){
  return IMPORT_COLUMNS.every(f => !obj[f]);
}

function emptyRow(){
  return {tracking:'', date:'', part:'', forwarder:'', po:'', status:'', planDate:'', inv:'', mpn:'', so:'', do:'', shipMode:'', note:'', qty:''};
}

function closeImportModal(){
  document.getElementById('importModalOverlay').style.display = 'none';
  pendingImport = null;
}

function sortRowsByPlanDate(rows){
  return [...rows].sort((a, b) => {
    const da = a.planDate || '';
    const db = b.planDate || '';
    if(!da && !db) return 0;
    if(!da) return 1;   // blank → push to end
    if(!db) return -1;
    return da.localeCompare(db); // YYYY-MM-DD sorts lexicographically
  });
}

function doImport(custMode){
  const sheetResults = pendingImport?.sheetResults;
  if(!sheetResults) return;

  const sheet = sheetResults[parseInt(document.getElementById('importSheetSel').value, 10) || 0];
  if(!sheet || sheet.rows.length === 0){ showToast('Sheet ที่เลือกไม่มีข้อมูล'); return; }

  let targetName;
  let mode = 'add';

  if(custMode === 'existing'){
    targetName = document.getElementById('importCustSel').value;
    mode = document.querySelector('input[name="importMode"]:checked')?.value || 'add';
    if(!targetName){ showToast('กรุณาเลือกลูกค้า'); return; }
  } else {
    targetName = document.getElementById('importNewName').value.trim();
    if(!targetName){ showToast('กรุณาระบุชื่อลูกค้า'); return; }
    if(state.customers.includes(targetName)){
      mode = 'add';   // already exists → append
    }
  }

  const exists = state.customers.includes(targetName);
  if(!exists){
    state.customers.push(targetName);
    state.data[targetName] = sortRowsByPlanDate(sheet.rows);
  } else if(mode === 'replace'){
    state.data[targetName] = sortRowsByPlanDate(sheet.rows);
  } else {
    const cleaned = (state.data[targetName] || []).filter(rowHasData);
    state.data[targetName] = sortRowsByPlanDate(cleaned.concat(sheet.rows));
  }

  state.active = targetName;
  saveState();
  closeImportModal();
  renderAll();
  showToast(`นำเข้าสำเร็จ: "${targetName}" · ${sheet.rows.length} รายการ (เรียงตาม Plan Date)`);
}

async function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  e.target.value = '';

  let wb;
  try{
    const buf = await file.arrayBuffer();
    wb = XLSX.read(buf, {type:'array'});
  }catch(err){
    showToast('ไม่สามารถอ่านไฟล์นี้ได้ กรุณาตรวจสอบรูปแบบไฟล์');
    return;
  }

  // Parse all sheets (excluding guide sheet)
  const sheetResults = [];
  wb.SheetNames
    .filter(n => n !== 'คำแนะนำ')
    .forEach(sheetName => {
      const ws = wb.Sheets[sheetName];
      const rows = parseSheetRows(ws);
      sheetResults.push({ name: sheetName.trim() || sheetName, rows });
    });

  if(sheetResults.length === 0){
    showToast('ไม่พบ Sheet ในไฟล์นี้');
    return;
  }

  openImportModal(sheetResults);
}

document.getElementById('importFile').addEventListener('change', handleImportFile);

    ['   หรือใช้ฟอร์แมต DD/MM/YYYY ก็ได้ ระบบจะแปลงให้อัตโนมัติ'],
    ['   ⚠ หากกรอกเป็น Date ใน Excel — ให้ตั้ง cell format เป็น YYYY-MM-DD ก่อน เพื่อป้องกัน timezone shift'],
    ['5. ค่า Status ที่ระบบรองรับ: ' + STATUS_OPTIONS.filter(o => o.value).map(o => o.label).join(', ')],
    ['6. ค่า Ship Mode ที่ระบบรองรับ: ' + SHIP_MODE_OPTIONS.filter(o => o.value).map(o => o.label).join(', ')],

/* ============================================================
   📦 ARCHIVE — move shipped rows out of the active sheet
   ============================================================ */
const ARCHIVE_KEY = 'shipmentArchiveData';

function loadArchive(){
  try{
    const raw = localStorage.getItem(ARCHIVE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return [];  // flat array of { customer, archivedAt, row }
}
function saveArchive(arr){ localStorage.setItem(ARCHIVE_KEY, JSON.stringify(arr)); }

function archiveShippedRows(customer){
  const rows = state.data[customer] || [];
  const toArchive = rows.filter(r => r.status === 'shipped');
  if(toArchive.length === 0){
    showToast('ไม่มีรายการที่มีสถานะ "ส่งแล้ว" ในหน้านี้');
    return;
  }
  if(!confirm(`ย้าย ${toArchive.length} รายการที่ "ส่งแล้ว" ของ "${customer}" ไป Archive?\n\nสามารถกู้คืนได้จากหน้า Archive`)) return;
  const archive = loadArchive();
  const now = new Date().toISOString();
  toArchive.forEach(r => archive.push({ customer, archivedAt: now, row: { ...r } }));
  saveArchive(archive);
  state.data[customer] = rows.filter(r => r.status !== 'shipped');
  saveState();
  renderAll();
  showToast(`ย้าย ${toArchive.length} รายการไป Archive แล้ว`);
}

function openArchivePanel(){
  renderArchivePanel();
  document.getElementById('archivePanel').classList.add('open');
  document.getElementById('archiveOverlay').classList.add('open');
}
function closeArchivePanel(){
  document.getElementById('archivePanel').classList.remove('open');
  document.getElementById('archiveOverlay').classList.remove('open');
}

function renderArchivePanel(filterCust = '', search = ''){
  const archive = loadArchive();
  const customers = [...new Set(archive.map(a => a.customer))].sort();

  // Controls
  const custOpts = ['<option value="">All Customers</option>',
    ...customers.map(c => `<option value="${escapeAttr(c)}" ${c===filterCust?'selected':''}>${escapeHtml(c)}</option>`)
  ].join('');
  document.getElementById('archiveControls').innerHTML = `
    <select id="archiveCustFilter">${custOpts}</select>
    <input type="text" id="archiveSearch" placeholder="🔍 ค้นหา Part No., PO..." value="${escapeAttr(search)}" style="flex:1;min-width:0;">
    <span class="archive-stat" id="archiveStat"></span>`;

  document.getElementById('archiveCustFilter').addEventListener('change', e => {
    renderArchivePanel(e.target.value, document.getElementById('archiveSearch').value);
  });
  document.getElementById('archiveSearch').addEventListener('input', e => {
    renderArchivePanel(document.getElementById('archiveCustFilter').value, e.target.value);
  });

  // Filter
  const sq = search.toLowerCase();
  const filtered = archive.filter((a, idx) => {
    a._idx = idx;
    if(filterCust && a.customer !== filterCust) return false;
    if(sq){
      const r = a.row;
      return [r.part,r.mpn,r.po,r.so,r.tracking,r.inv,r.forwarder,r.note].some(v => (v||'').toLowerCase().includes(sq));
    }
    return true;
  });

  const list = document.getElementById('archiveList');
  document.getElementById('archiveStat').textContent = `${filtered.length} รายการ`;

  if(filtered.length === 0){
    list.innerHTML = `<div class="archive-empty">${archive.length === 0 ? '📦 ยังไม่มีข้อมูลใน Archive' : 'ไม่พบรายการที่ตรงกัน'}</div>`;
    return;
  }

  // Group by customer + archivedAt date
  list.innerHTML = filtered.map((a, i) => {
    const r = a.row;
    const arDate = new Date(a.archivedAt);
    const arStamp = arDate.getDate() + '/' + pad2(arDate.getMonth()+1) + '/' + (arDate.getFullYear()+543);
    const metaParts = [
      a.customer,
      r.po ? 'PO: '+r.po : '',
      r.planDate ? 'Plan: '+r.planDate : '',
      r.date ? 'Shipped: '+r.date : '',
      r.qty ? 'Qty: '+r.qty : '',
      r.forwarder || '',
      r.tracking ? 'TRK: '+r.tracking : '',
    ].filter(Boolean);
    return `
      <div class="archive-item">
        <div class="archive-item-head">
          <div>
            <div class="archive-item-pn">${escapeHtml(r.mpn || r.part || '—')}${r.mpn && r.part ? ` <span style="font-weight:400;color:var(--muted);font-size:11px;">(${escapeHtml(r.part)})</span>` : ''}</div>
          </div>
          <button class="archive-restore" data-orig-idx="${a._idx}">↩ Restore</button>
        </div>
        <div class="archive-item-meta">
          ${metaParts.map((m,j) => `<span>${escapeHtml(m)}</span>`).join('')}
        </div>
        <div style="font-family:var(--mono);font-size:10.5px;color:#C4CADA;">Archived ${arStamp}</div>
      </div>`;
  }).join('');

  list.querySelectorAll('.archive-restore').forEach(btn => {
    btn.addEventListener('click', () => {
      const origIdx = parseInt(btn.dataset.origIdx, 10);
      restoreFromArchive(origIdx);
    });
  });
}

function restoreFromArchive(origIdx){
  const archive = loadArchive();
  const item = archive[origIdx];
  if(!item) return;
  // Restore row to its customer sheet
  if(!state.customers.includes(item.customer)){
    state.customers.push(item.customer);
    state.data[item.customer] = [];
  }
  state.data[item.customer].push({ ...item.row });
  archive.splice(origIdx, 1);
  saveArchive(archive);
  saveState();
  renderAll();
  renderArchivePanel(
    document.getElementById('archiveCustFilter')?.value || '',
    document.getElementById('archiveSearch')?.value || ''
  );
  showToast(`กู้คืน ${item.row.part || item.row.mpn || 'รายการ'} ไปที่ "${item.customer}" แล้ว`);
}

function exportArchive(){
  const archive = loadArchive();
  if(archive.length === 0){ showToast('ไม่มีข้อมูลใน Archive'); return; }
  const header = ['Customer', 'Archived Date', 'Part No.', 'MPN', 'PO', "Q'ty", 'SO', 'DO',
    'Plan Date', 'Ship Date', 'Ship Mode', 'Forwarder', 'Tracking', 'INV', 'Status', 'Noted'];
  const rows = archive.map(a => {
    const r = a.row;
    return [a.customer, a.archivedAt.slice(0,10), r.part||'', r.mpn||'', r.po||'', r.qty||'',
      r.so||'', r.do||'', r.planDate||'', r.date||'', r.shipMode||'', r.forwarder||'',
      r.tracking||'', r.inv||'', statusMeta(r.status).label.replace('— เลือกสถานะ —',''), r.note||''];
  });
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
  ws['!cols'] = header.map(() => ({ wch: 18 }));
  XLSX.utils.book_append_sheet(wb, ws, 'Archive');
  const stamp = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `shipment-archive-${stamp}.xlsx`);
  showToast('Export Archive สำเร็จ');
}

document.getElementById('archiveBtn').addEventListener('click', openArchivePanel);
document.getElementById('archiveCloseBtn').addEventListener('click', closeArchivePanel);
document.getElementById('archiveOverlay').addEventListener('click', closeArchivePanel);
document.getElementById('archiveExportBtn').addEventListener('click', exportArchive);

/* ============================================================
   🔍 Global PO / Part / Tracking search across all customers
   ============================================================ */
(function(){
  const SEARCH_FIELDS = ['po','part','mpn','tracking','inv','so','do'];

  function highlight(text, query){
    if(!query || !text) return escapeHtml(text||'');
    const idx = text.toLowerCase().indexOf(query.toLowerCase());
    if(idx === -1) return escapeHtml(text);
    return escapeHtml(text.slice(0,idx))
      + `<mark class="hl">${escapeHtml(text.slice(idx, idx+query.length))}</mark>`
      + escapeHtml(text.slice(idx+query.length));
  }

  function searchAll(query){
    const q = query.trim().toLowerCase();
    if(!q) return [];
    const results = [];
    state.customers.forEach(customer => {
      (state.data[customer] || []).forEach((r, idx) => {
        const match = SEARCH_FIELDS.some(f => (r[f]||'').toLowerCase().includes(q));
        if(!match) return;
        results.push({ customer, idx, r });
        if(results.length >= 50) return;
      });
    });
    return results;
  }

  function renderResults(results, query){
    const box = document.getElementById('globalSearchResults');
    if(results.length === 0){
      box.innerHTML = `<div class="global-search-empty">ไม่พบผลลัพธ์สำหรับ "${escapeHtml(query)}"</div>`;
      box.style.display = 'block';
      return;
    }
    box.innerHTML = results.map(({customer, idx, r}) => {
      const po      = r.po      ? highlight(r.po,      query) : '—';
      const part    = r.part    ? highlight(r.part,    query) : '';
      const mpn     = r.mpn     ? highlight(r.mpn,     query) : '';
      const trk     = r.tracking? highlight(r.tracking,query) : '';
      const meta = [
        part ? `Part: ${part}` : '',
        mpn  ? `MPN: ${mpn}`   : '',
        r.planDate ? `Plan: ${r.planDate}` : '',
        trk  ? `TRK: ${trk}`  : '',
        r.qty ? `Qty: ${r.qty}` : '',
      ].filter(Boolean).join(' · ');
      return `<div class="global-search-item" data-customer="${escapeAttr(customer)}" data-idx="${idx}">
        <div class="global-search-item-icon">📋</div>
        <div class="global-search-item-body">
          <div class="global-search-item-po">PO: ${po}</div>
          <div class="global-search-item-meta">${meta||'&nbsp;'}</div>
        </div>
        <div class="global-search-item-cust">${escapeHtml(customer)}</div>
      </div>`;
    }).join('') + (results.length >= 50 ? `<div class="global-search-empty" style="border-top:1px solid var(--border);">แสดง 50 ผลลัพธ์แรก</div>` : '');
    box.style.display = 'block';

    box.querySelectorAll('.global-search-item').forEach(el => {
      el.addEventListener('click', () => {
        const customer = el.dataset.customer;
        const rowIdx   = parseInt(el.dataset.idx, 10);
        document.getElementById('globalPoSearch').value = '';
        box.style.display = 'none';
        if(state.active !== customer){
          state.active = customer;
          filterState = {};
          colHiddenValues = {};
          saveState();
          renderAll();
        }
        setTimeout(() => {
          const tbody = document.getElementById('tbody');
          if(!tbody) return;
          const tr = tbody.querySelector(`tr[data-row-idx="${rowIdx}"]`);
          if(tr){
            tr.scrollIntoView({ behavior:'smooth', block:'center' });
            tr.classList.remove('alert-highlight');
            void tr.offsetWidth;
            tr.classList.add('alert-highlight');
            setTimeout(() => tr.classList.remove('alert-highlight'), 2200);
          }
        }, 80);
      });
    });
  }

  let searchTimer;
  const input = document.getElementById('globalPoSearch');
  const box   = document.getElementById('globalSearchResults');

  input.addEventListener('input', () => {
    clearTimeout(searchTimer);
    const q = input.value.trim();
    if(!q){ box.style.display = 'none'; return; }
    searchTimer = setTimeout(() => {
      renderResults(searchAll(q), q);
    }, 180);
  });

  input.addEventListener('keydown', e => {
    if(e.key === 'Escape'){ box.style.display = 'none'; input.value = ''; }
  });

  document.addEventListener('click', e => {
    if(!input.contains(e.target) && !box.contains(e.target)){
      box.style.display = 'none';
    }
  });
})();

renderAll();
updateUndoBtn();
</script>
